#cloud-config

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - jq

write_files:
  # ── Docker Compose (production) ──────────────────────────────────────
  - path: /opt/octowatch/docker-compose.yml
    permissions: "0640"
    content: |
      x-app-env: &app-env
        DATABASE_URL: $${DATABASE_URL}
        VALKEY_URL: $${VALKEY_URL}
        SECRET_KEY: $${SECRET_KEY}
        ENCRYPTION_KEY: $${ENCRYPTION_KEY}
        GITHUB_CLIENT_ID: $${GITHUB_CLIENT_ID}
        GITHUB_CLIENT_SECRET: $${GITHUB_CLIENT_SECRET}
        LOG_LEVEL: $${LOG_LEVEL:-INFO}
        GEOIP_DB_PATH: $${GEOIP_DB_PATH:-/app/data/GeoLite2-City.mmdb}
        APP_BASE_URL: $${APP_BASE_URL}
        INITIAL_ADMIN_LOGINS: $${INITIAL_ADMIN_LOGINS:-}

      networks:
        frontend:
          driver: bridge
        backend:
          driver: bridge
        data:
          driver: bridge

      services:
        db:
          image: timescale/timescaledb:2.25.1-pg16
          environment:
            POSTGRES_USER: $${POSTGRES_USER}
            POSTGRES_PASSWORD: $${POSTGRES_PASSWORD}
            POSTGRES_DB: $${POSTGRES_DB}
          volumes:
            - /data/pg_data:/var/lib/postgresql/data
          networks:
            - data
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
          restart: unless-stopped

        valkey:
          image: valkey/valkey:9.0.3-alpine
          command: valkey-server --requirepass $${VALKEY_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
          volumes:
            - /data/valkey_data:/data
          networks:
            - data
          healthcheck:
            test: ["CMD", "valkey-cli", "-a", "$${VALKEY_PASSWORD}", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
          restart: unless-stopped

        minio:
          image: minio/minio:RELEASE.2025-09-07T16-13-09Z
          command: server /data --console-address ":9001"
          environment:
            MINIO_ROOT_USER: $${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: $${MINIO_ROOT_PASSWORD}
          volumes:
            - /data/minio_data:/data
          networks:
            - data
          healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 10s
            timeout: 5s
            retries: 5
          restart: unless-stopped

        minio-setup:
          image: minio/mc:RELEASE.2025-08-13T08-35-41Z
          depends_on:
            minio:
              condition: service_healthy
          environment:
            MINIO_ROOT_USER: $${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: $${MINIO_ROOT_PASSWORD}
            MINIO_INGEST_USER: $${MINIO_INGEST_USER}
            MINIO_INGEST_PASSWORD: $${MINIO_INGEST_PASSWORD}
            MINIO_AUDIT_BUCKET: $${MINIO_AUDIT_BUCKET}
          entrypoint: /bin/sh
          command: >
            -c "
            mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
            mc mb --ignore-existing local/$${MINIO_AUDIT_BUCKET} &&
            mc admin user add local $${MINIO_INGEST_USER} $${MINIO_INGEST_PASSWORD} 2>/dev/null || true &&
            mc admin policy attach local readwrite --user $${MINIO_INGEST_USER} 2>/dev/null || true &&
            echo 'MinIO setup complete'
            "
          networks:
            - data
          restart: "no"

        migrate:
          image: ${acr_login_server}/octowatch-api:latest
          command: ["python", "-m", "alembic", "upgrade", "head"]
          environment:
            DATABASE_URL: $${DATABASE_URL}
          depends_on:
            db:
              condition: service_healthy
          networks:
            - data
          restart: "no"

        api:
          image: ${acr_login_server}/octowatch-api:latest
          environment:
            <<: *app-env
            MINIO_ENDPOINT_URL: $${MINIO_ENDPOINT_URL:-http://minio:9000}
            MINIO_INGEST_USER: $${MINIO_INGEST_USER}
            MINIO_INGEST_PASSWORD: $${MINIO_INGEST_PASSWORD}
            MINIO_AUDIT_BUCKET: $${MINIO_AUDIT_BUCKET}
            QUERY_MAX_ROWS: $${QUERY_MAX_ROWS:-100000}
            QUERY_TIMEOUT_SECONDS: $${QUERY_TIMEOUT_SECONDS:-30}
            DETECTION_CONFIDENCE_THRESHOLD: $${DETECTION_CONFIDENCE_THRESHOLD:-0.7}
            MAXMIND_LICENSE_KEY: $${MAXMIND_LICENSE_KEY:-}
            GITHUB_APP_ID: $${GITHUB_APP_ID:-}
            GITHUB_APP_PRIVATE_KEY_PATH: ""
            GITHUB_ENTERPRISE_SLUG: $${GITHUB_ENTERPRISE_SLUG:-}
            GITHUB_SYNC_ENABLED: $${GITHUB_SYNC_ENABLED:-false}
            GITHUB_SYNC_INTERVAL_DAYS: $${GITHUB_SYNC_INTERVAL_DAYS:-60}
            GITHUB_SYNC_ORGS: $${GITHUB_SYNC_ORGS:-}
          ports:
            - "127.0.0.1:8000:8000"
          depends_on:
            db:
              condition: service_healthy
            valkey:
              condition: service_healthy
            migrate:
              condition: service_completed_successfully
          networks:
            - backend
            - data
          healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/api/docs"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 20s
          restart: unless-stopped

        beat:
          image: ${acr_login_server}/octowatch-worker:latest
          command: celery -A app.celery_app beat --loglevel=$${LOG_LEVEL:-INFO}
          environment:
            <<: *app-env
          depends_on:
            api:
              condition: service_healthy
          networks:
            - backend
            - data
          restart: unless-stopped

        worker-ingestion:
          image: ${acr_login_server}/octowatch-worker:latest
          command: celery -A app.celery_app worker -Q ingestion -c 4 --loglevel=$${LOG_LEVEL:-INFO} -n ingestion@%h
          environment:
            <<: *app-env
            MINIO_ENDPOINT_URL: $${MINIO_ENDPOINT_URL:-http://minio:9000}
            MINIO_INGEST_USER: $${MINIO_INGEST_USER}
            MINIO_INGEST_PASSWORD: $${MINIO_INGEST_PASSWORD}
            MINIO_AUDIT_BUCKET: $${MINIO_AUDIT_BUCKET}
          depends_on:
            db:
              condition: service_healthy
            valkey:
              condition: service_healthy
            minio:
              condition: service_healthy
          networks:
            - backend
            - data
          restart: unless-stopped

        worker-detection:
          image: ${acr_login_server}/octowatch-worker:latest
          command: celery -A app.celery_app worker -Q detection,notification,ticketing -c 8 --loglevel=$${LOG_LEVEL:-INFO} -n detection@%h
          environment:
            <<: *app-env
          depends_on:
            db:
              condition: service_healthy
            valkey:
              condition: service_healthy
          networks:
            - backend
            - data
          restart: unless-stopped

        worker-baseline:
          image: ${acr_login_server}/octowatch-worker:latest
          command: celery -A app.celery_app worker -Q baseline -c 2 --loglevel=$${LOG_LEVEL:-INFO} -n baseline@%h
          environment:
            <<: *app-env
          depends_on:
            db:
              condition: service_healthy
            valkey:
              condition: service_healthy
          networks:
            - backend
            - data
          restart: unless-stopped

        worker-sync:
          image: ${acr_login_server}/octowatch-worker:latest
          command: celery -A app.celery_app worker -Q sync -c 2 --loglevel=$${LOG_LEVEL:-INFO} -n sync@%h
          environment:
            <<: *app-env
            GITHUB_APP_ID: $${GITHUB_APP_ID:-}
            GITHUB_APP_PRIVATE_KEY_PATH: ""
            GITHUB_ENTERPRISE_SLUG: $${GITHUB_ENTERPRISE_SLUG:-}
            GITHUB_SYNC_ENABLED: $${GITHUB_SYNC_ENABLED:-false}
            GITHUB_SYNC_INTERVAL_DAYS: $${GITHUB_SYNC_INTERVAL_DAYS:-60}
            GITHUB_SYNC_ORGS: $${GITHUB_SYNC_ORGS:-}
          depends_on:
            db:
              condition: service_healthy
            valkey:
              condition: service_healthy
          networks:
            - backend
            - data
          restart: unless-stopped

        frontend:
          image: ${acr_login_server}/octowatch-frontend:latest
          ports:
            - "127.0.0.1:3001:3001"
          networks:
            - frontend
          restart: unless-stopped

  # ── Caddyfile ────────────────────────────────────────────────────────
  - path: /etc/caddy/Caddyfile
    permissions: "0644"
    content: |
      ${fqdn} {
        # API
        handle /api/* {
          reverse_proxy localhost:8000
        }

        # MinIO S3 endpoint (audit log streaming)
        handle /s3/* {
          uri strip_prefix /s3
          reverse_proxy localhost:9000
        }

        # Frontend SPA (catch-all)
        handle {
          reverse_proxy localhost:3001
        }
      }

  # ── Environment file ────────────────────────────────────────────────
  - path: /opt/octowatch/.env
    permissions: "0600"
    content: |
      DATABASE_URL=postgresql+asyncpg://octowatch:${postgres_password}@db:5432/octowatch
      SECRET_KEY=${secret_key}
      ENCRYPTION_KEY=${encryption_key}
      VALKEY_URL=redis://:${valkey_password}@valkey:6379/0
      LOG_LEVEL=INFO
      INGESTION_MODE=s3
      GITHUB_CLIENT_ID=${github_client_id}
      GITHUB_CLIENT_SECRET=${github_client_secret}
      APP_BASE_URL=https://${fqdn}
      POSTGRES_USER=octowatch
      POSTGRES_PASSWORD=${postgres_password}
      POSTGRES_DB=octowatch
      VALKEY_PASSWORD=${valkey_password}
      MINIO_ENDPOINT_URL=http://minio:9000
      MINIO_AUDIT_BUCKET=audit-logs
      MINIO_ROOT_USER=minioadmin
      MINIO_ROOT_PASSWORD=${minio_root_password}
      MINIO_INGEST_USER=ingest
      MINIO_INGEST_PASSWORD=${minio_ingest_password}
      GITHUB_APP_ID=${github_app_id}
      GITHUB_ENTERPRISE_SLUG=${github_enterprise_slug}
      GITHUB_SYNC_ENABLED=false
      GITHUB_SYNC_INTERVAL_DAYS=60
      INITIAL_ADMIN_LOGINS=${initial_admin_logins}

  # ── Deploy script ───────────────────────────────────────────────────
  - path: /opt/octowatch/deploy.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      ACR_NAME="${acr_name}"
      IMAGE_TAG="$${1:-latest}"

      echo "==> Logging into ACR..."
      az acr login --name "$ACR_NAME"

      echo "==> Pulling latest images..."
      docker compose -f /opt/octowatch/docker-compose.yml pull

      echo "==> Starting services..."
      docker compose -f /opt/octowatch/docker-compose.yml up -d --remove-orphans

      echo "==> Cleaning up old images..."
      docker image prune -f

      echo "==> Deploy complete"

  # ── Systemd service ─────────────────────────────────────────────────
  - path: /etc/systemd/system/octowatch.service
    permissions: "0644"
    content: |
      [Unit]
      Description=OctoWatch Docker Compose Stack
      Requires=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/octowatch
      ExecStart=/usr/bin/docker compose up -d --remove-orphans
      ExecStop=/usr/bin/docker compose down
      EnvironmentFile=/opt/octowatch/.env

      [Install]
      WantedBy=multi-user.target

runcmd:
  # ── Install Docker ──────────────────────────────────────────────────
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" \
    > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ${admin_username}

  # ── Install Azure CLI ───────────────────────────────────────────────
  - curl -sL https://aka.ms/InstallAzureCLIDeb | bash

  # ── Install Caddy ───────────────────────────────────────────────────
  - apt-get install -y debian-keyring debian-archive-keyring apt-transport-https
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' > /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update
  - apt-get install -y caddy

  # ── Format and mount data disk ──────────────────────────────────────
  - |
    DISK="/dev/disk/azure/scsi1/lun0"
    if ! blkid "$DISK"; then
      mkfs.ext4 "$DISK"
    fi
    mkdir -p /data
    echo "$DISK /data ext4 defaults,nofail 0 2" >> /etc/fstab
    mount /data
  - mkdir -p /data/pg_data /data/valkey_data /data/minio_data
  - chown -R 999:999 /data/pg_data

  # ── Set ownership ───────────────────────────────────────────────────
  - chown -R ${admin_username}:${admin_username} /opt/octowatch

  # ── Login to ACR and start services ─────────────────────────────────
  - az login --identity
  - az acr login --name ${acr_name}
  - systemctl daemon-reload
  - systemctl enable caddy
  - systemctl start caddy
  - systemctl enable octowatch
  - systemctl start octowatch
