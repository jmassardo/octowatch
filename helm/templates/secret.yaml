# Secret — reference template only. Real values must be injected externally.
#
# DO NOT store real secrets in values.yaml or this chart.
# Recommended approaches (in order of preference):
#   1. External Secrets Operator (ESO) — pulls from Azure Key Vault, AWS Secrets Manager, Vault, etc.
#   2. Sealed Secrets — encrypts secrets for GitOps storage
#   3. Helm --set flags at deploy time (ensure CI/CD secrets are not logged)
#
# Set useExternalSecrets: true (e.g. in values-azure.yaml) to skip this template
# entirely when secrets are pre-provisioned by Terraform or another external tool.
# The externally-created secret must have annotation:
#   argocd.argoproj.io/sync-options: Prune=false
# so ArgoCD will not attempt to delete it during pruning runs.
#
{{- if not .Values.useExternalSecrets }}
# Placeholder secret — replace with real values or use ExternalSecret/SealedSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "octowatch.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octowatch.labels" . | nindent 4 }}
  annotations:
    octowatch/secret-management: "placeholder — inject real values before deploying"
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  secret-key: "REPLACE_WITH_REAL_SECRET_KEY"
  database-url: "REPLACE_WITH_REAL_DATABASE_URL"
  valkey-url: "REPLACE_WITH_REAL_VALKEY_URL"
  github-client-id: "REPLACE_WITH_REAL_GITHUB_CLIENT_ID"
  github-client-secret: "REPLACE_WITH_REAL_GITHUB_CLIENT_SECRET"
  github-rules-token: ""
{{- end }}

