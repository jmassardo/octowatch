# Secret — reference template only. Real values must be injected externally.
#
# Set useExternalSecrets: true (e.g. in values-azure.yaml) when secrets are
# pre-provisioned by Terraform or another external tool. ArgoCD will track the
# resource but never apply, update, or prune it (Skip=true sync option).
#
{{- if .Values.useExternalSecrets }}
# Stub — ArgoCD tracks this name so it is not considered an orphan for pruning,
# but the Skip=true annotation prevents any create/update/delete operations.
# The actual secret is created and managed by Terraform (terraform/aks.tf).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "octowatch.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octowatch.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: "Skip=true"
    helm.sh/resource-policy: keep
type: Opaque
{{- else }}
# Placeholder secret — replace with real values or use ExternalSecret/SealedSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "octowatch.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octowatch.labels" . | nindent 4 }}
  annotations:
    octowatch/secret-management: "placeholder — inject real values before deploying"
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  secret-key: "REPLACE_WITH_REAL_SECRET_KEY"
  database-url: "REPLACE_WITH_REAL_DATABASE_URL"
  valkey-url: "REPLACE_WITH_REAL_VALKEY_URL"
  github-client-id: "REPLACE_WITH_REAL_GITHUB_CLIENT_ID"
  github-client-secret: "REPLACE_WITH_REAL_GITHUB_CLIENT_SECRET"
  github-rules-token: ""
{{- end }}
