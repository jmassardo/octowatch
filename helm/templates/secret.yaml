# Secret — reference template only. Real values must be injected externally.
#
# DO NOT store real secrets in values.yaml or this chart.
# Recommended approaches (in order of preference):
#   1. External Secrets Operator (ESO) — pulls from AWS Secrets Manager, Vault, etc.
#   2. Sealed Secrets — encrypts secrets for GitOps storage
#   3. Helm --set flags at deploy time (ensure CI/CD secrets are not logged)
#
# This template creates a placeholder Secret so the chart lints cleanly.
# Replace with an ExternalSecret or SealedSecret resource in production.
#
# Required keys:
#   secret-key            — FastAPI JWT signing key (openssl rand -hex 32)
#   database-url          — Full asyncpg URL (postgresql+asyncpg://user:pass@host/db)
#   valkey-url            — redis://[:password]@host:6379/0
#   github-client-id      — GitHub OAuth App client ID
#   github-client-secret  — GitHub OAuth App client secret
#   github-rules-token    — GitHub PAT with contents:write on the rules repo (optional)
#   minio-root-user       — MinIO root user (only needed when minio.enabled=true)
#   minio-root-password   — MinIO root password
#   minio-ingest-user     — MinIO read-only ingestion service account
#   minio-ingest-password — MinIO ingestion service account password
#
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "audit-log-analyzer.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit-log-analyzer.labels" . | nindent 4 }}
  annotations:
    # Reminder: replace this Secret with ExternalSecret or SealedSecret in production
    audit-log-analyzer/secret-management: "placeholder — inject real values before deploying"
type: Opaque
# stringData values below are PLACEHOLDERS only — they will cause application
# startup failure. Replace with real values via --set or an external secret manager.
stringData:
  secret-key: "REPLACE_WITH_REAL_SECRET_KEY"
  database-url: "REPLACE_WITH_REAL_DATABASE_URL"
  valkey-url: "REPLACE_WITH_REAL_VALKEY_URL"
  github-client-id: "REPLACE_WITH_REAL_GITHUB_CLIENT_ID"
  github-client-secret: "REPLACE_WITH_REAL_GITHUB_CLIENT_SECRET"
  github-rules-token: ""  # Optional — leave empty to disable GitHub rule sync
  minio-root-user: "REPLACE_WITH_REAL_MINIO_ROOT_USER"
  minio-root-password: "REPLACE_WITH_REAL_MINIO_ROOT_PASSWORD"
  minio-ingest-user: "REPLACE_WITH_REAL_MINIO_INGEST_USER"
  minio-ingest-password: "REPLACE_WITH_REAL_MINIO_INGEST_PASSWORD"
