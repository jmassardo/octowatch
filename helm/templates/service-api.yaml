apiVersion: v1
kind: Service
metadata:
  name: {{ include "octowatch.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octowatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.observability.metrics.enabled }}
    - port: {{ .Values.observability.metrics.port }}
      targetPort: http
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "octowatch.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
