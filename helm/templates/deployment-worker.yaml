{{/*
Three separate Deployments for ingestion, detection, and baseline Celery workers.
They share the same worker image but differ in: queue, concurrency, resources, and env.
*/}}

# ──────────────────────────────────────────────────────────────────────────────
# Ingestion worker
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "octowatch.fullname" . }}-worker-ingestion
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octowatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-ingestion
  {{- if .Values.reloader.enabled }}
  annotations:
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  replicas: {{ .Values.worker.ingestion.replicaCount }}
  selector:
    matchLabels:
      {{- include "octowatch.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker-ingestion
  template:
    metadata:
      labels:
        {{- include "octowatch.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker-ingestion
        {{- if .Values.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "octowatch.serviceAccountName" . }}
      # Workers need extra time to finish in-progress tasks before shutdown.
      # Celery's late-ack ensures unfinished tasks are re-queued on SIGTERM.
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: {{ .Values.worker.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.worker.securityContext.runAsUser }}
        fsGroup: {{ .Values.worker.securityContext.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker-ingestion
          image: {{ include "octowatch.workerImage" . }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command:
            - celery
            - -A
            - app.celery_app
            - worker
            - -Q
            - ingestion
            - -c
            - {{ .Values.worker.ingestion.concurrency | quote }}
            - --loglevel
            - INFO
            - --without-heartbeat
          resources:
            {{- toYaml .Values.worker.ingestion.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: {{ .Values.worker.securityContext.readOnlyRootFilesystem }}
            allowPrivilegeEscalation: {{ .Values.worker.securityContext.allowPrivilegeEscalation }}
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: {{ include "octowatch.configMapName" . }}
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "octowatch.secretName" . }}
                  key: secret-key
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "octowatch.secretName" . }}
                  key: encryption-key
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "octowatch.secretName" . }}
                  key: database-url
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "octowatch.secretName" . }}
                  key: valkey-url
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "octowatch.secretName" . }}
                  key: github-client-id
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "octowatch.secretName" . }}
                  key: github-client-secret
            {{- if .Values.workloadIdentity.enabled }}
            - name: SECRET_PROVIDER
              value: "azure_keyvault"
            - name: AZURE_KEYVAULT_URI
              value: {{ .Values.keyVault.uri | quote }}
            {{- else }}
            - name: SECRET_PROVIDER
              value: "env"
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-data
              mountPath: /app/data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-data
          emptyDir: {}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
