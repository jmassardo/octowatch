apiVersion: v1
kind: Service
metadata:
  name: {{ include "audit-log-analyzer.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit-log-analyzer.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "audit-log-analyzer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
