{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "octowatch.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octowatch.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # API traffic — route /api/ and /auth/ to the backend
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: {{ include "octowatch.fullname" . }}-api
                port:
                  name: http
          - path: /auth/
            pathType: Prefix
            backend:
              service:
                name: {{ include "octowatch.fullname" . }}-api
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ include "octowatch.fullname" . }}-api
                port:
                  name: http
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: {{ include "octowatch.fullname" . }}-api
                port:
                  name: http
          # GitHub Audit Log Streaming (Splunk HEC-compatible collector)
          - path: /services/
            pathType: Prefix
            backend:
              service:
                name: {{ include "octowatch.fullname" . }}-api
                port:
                  name: http
          # All other traffic → frontend SPA
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "octowatch.fullname" . }}-frontend
                port:
                  name: http
{{- end }}
