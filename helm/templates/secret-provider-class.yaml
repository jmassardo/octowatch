{{- if .Values.workloadIdentity.enabled }}
# SecretProviderClass for the Azure Key Vault CSI driver.
# Syncs infrastructure secrets (DATABASE_URL, VALKEY_URL) from Key Vault into
# Kubernetes Secrets so they remain available as env vars in the pods.
# Application-level secrets (HEC token, webhook secret, etc.) are fetched
# directly by the SecretProvider abstraction layer at runtime.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "octowatch.fullname" . }}-keyvault
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octowatch.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.workloadIdentity.clientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.workloadIdentity.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: valkey-url
          objectType: secret
        - |
          objectName: secret-key
          objectType: secret
  secretObjects:
    - secretName: {{ include "octowatch.secretName" . }}-csi
      type: Opaque
      data:
        - objectName: database-url
          key: database-url
        - objectName: valkey-url
          key: valkey-url
        - objectName: secret-key
          key: secret-key
{{- end }}
