# Helm post-install hook: creates the MinIO audit-log bucket, attaches bucket
# event notifications → Valkey, and creates the scoped ingestion service account.
# Only runs when minio.enabled=true (self-hosted MinIO subchart).
{{- if .Values.minio.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "audit-log-analyzer.fullname" . }}-minio-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audit-log-analyzer.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-setup
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "audit-log-analyzer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio-setup
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio-setup
          image: minio/mc:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: false  # mc writes config to ~/.mc
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: MINIO_ENDPOINT
              value: "http://{{ include "audit-log-analyzer.fullname" . }}-minio:9000"
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "audit-log-analyzer.secretName" . }}
                  key: minio-root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "audit-log-analyzer.secretName" . }}
                  key: minio-root-password
            - name: MINIO_INGEST_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "audit-log-analyzer.secretName" . }}
                  key: minio-ingest-user
            - name: MINIO_INGEST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "audit-log-analyzer.secretName" . }}
                  key: minio-ingest-password
            - name: BUCKET_NAME
              value: {{ .Values.minio.bucketName | default "audit-logs" | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Waiting for MinIO..."
              until mc alias set local "${MINIO_ENDPOINT}" "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"; do
                sleep 5
              done

              echo "Creating audit log bucket..."
              mc mb --ignore-existing "local/${BUCKET_NAME}"

              echo "Attaching bucket event notification..."
              mc event add "local/${BUCKET_NAME}" arn:minio:sqs::PRIMARY:redis --event put || true

              echo "Creating read-only ingestion policy..."
              cat > /tmp/ro-policy.json <<EOF
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Action": ["s3:GetObject","s3:ListBucket"],
                    "Resource": [
                      "arn:aws:s3:::${BUCKET_NAME}",
                      "arn:aws:s3:::${BUCKET_NAME}/*"
                    ]
                  }
                ]
              }
              EOF
              mc admin policy create local ingestion-ro /tmp/ro-policy.json || true

              echo "Creating scoped ingestion service account..."
              mc admin user add local "${MINIO_INGEST_USER}" "${MINIO_INGEST_PASSWORD}" || true
              mc admin policy attach local ingestion-ro --user "${MINIO_INGEST_USER}" || true

              echo "minio-setup: completed successfully"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: mc-config
              mountPath: /root/.mc
      volumes:
        - name: tmp
          emptyDir: {}
        - name: mc-config
          emptyDir: {}
{{- end }}
