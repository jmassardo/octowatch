# Non-secret application configuration.
# All secret values (DATABASE_URL, SECRET_KEY, etc.) live in secret.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "octowatch.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octowatch.labels" . | nindent 4 }}
data:
  # Application base URL — used for OAuth callbacks, SAML ACS, and absolute link generation
  APP_BASE_URL: {{ if .Values.ingress.enabled -}}
    "https://{{ .Values.ingress.host }}"
  {{- else -}}
    {{ .Values.appBaseUrl | default "http://localhost:8000" | quote }}
  {{- end }}

  # Logging
  LOG_LEVEL: {{ .Values.observability.logLevel | default "INFO" | quote }}

  # Ingestion backend: "hec" | "s3" | "azure_blob"
  INGESTION_MODE: {{ .Values.ingestion.mode | default "hec" | quote }}

  # GitHub Rules integration (optional — leave empty to disable rule sync)
  GITHUB_RULES_BRANCH: {{ .Values.githubRules.branch | default "main" | quote }}

  # GeoIP database location (mounted as an emptyDir; fetched at runtime if MAXMIND_LICENSE_KEY is set)
  GEOIP_DB_PATH: "/app/data/GeoLite2-City.mmdb"

  # Query engine limits
  DETECTION_CONFIDENCE_THRESHOLD: {{ .Values.detection.confidenceThreshold | default 0.7 | quote }}
  QUERY_MAX_ROWS: {{ .Values.security.queryMaxRows | default 100000 | quote }}
  QUERY_TIMEOUT_SECONDS: {{ .Values.security.queryTimeoutSeconds | default 30 | quote }}
