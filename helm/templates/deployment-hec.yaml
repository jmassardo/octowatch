{{- if .Values.hec.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "octowatch.fullname" . }}-hec
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octowatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: hec
spec:
  replicas: {{ .Values.hec.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "octowatch.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hec
  template:
    metadata:
      labels:
        {{- include "octowatch.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: hec
        {{- if .Values.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "octowatch.serviceAccountName" . }}
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "octowatch.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: hec
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: {{ .Values.api.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.api.securityContext.runAsUser }}
        fsGroup: {{ .Values.api.securityContext.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hec
          image: {{ include "octowatch.apiImage" . }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 10
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.hec.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: {{ .Values.api.securityContext.readOnlyRootFilesystem }}
            allowPrivilegeEscalation: {{ .Values.api.securityContext.allowPrivilegeEscalation }}
            runAsNonRoot: {{ .Values.api.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.api.securityContext.runAsUser }}
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: {{ include "octowatch.configMapName" . }}
          env:
            - name: OCTOWATCH_ROLE
              value: "hec"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "octowatch.secretName" . }}
                  key: secret-key
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "octowatch.secretName" . }}
                  key: encryption-key
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "octowatch.secretName" . }}
                  key: database-url
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "octowatch.secretName" . }}
                  key: valkey-url
            {{- if .Values.workloadIdentity.enabled }}
            - name: SECRET_PROVIDER
              value: "azure_keyvault"
            - name: AZURE_KEYVAULT_URI
              value: {{ .Values.keyVault.uri | quote }}
            {{- else }}
            - name: SECRET_PROVIDER
              value: "env"
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-data
              mountPath: /app/data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-data
          emptyDir: {}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
