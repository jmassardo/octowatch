# Standalone TimescaleDB StatefulSet
# Replaces the bitnami/postgresql subchart which is incompatible with the
# timescale/timescaledb community image. Deployed when postgresql.enabled=false.
{{- if not .Values.postgresql.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: octowatch-postgresql-init-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octowatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
data:
  01_init.sh: |
    #!/bin/bash
    set -e
    # Enable TimescaleDB extension
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE EXTENSION IF NOT EXISTS timescaledb;
      DO \$\$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'app_rw') THEN
          CREATE ROLE app_rw WITH LOGIN PASSWORD '${APP_PASSWORD}';
        ELSE
          ALTER ROLE app_rw WITH PASSWORD '${APP_PASSWORD}';
        END IF;
      END
      \$\$;
      GRANT ALL PRIVILEGES ON DATABASE auditlogs TO app_rw;
      GRANT ALL ON SCHEMA public TO app_rw;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO app_rw;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO app_rw;
    EOSQL

---
apiVersion: v1
kind: Service
metadata:
  name: octowatch-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octowatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - name: tcp-postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app.kubernetes.io/name: octowatch-postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: v1
kind: Service
metadata:
  name: octowatch-postgresql-hl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octowatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: tcp-postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app.kubernetes.io/name: octowatch-postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: octowatch-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "octowatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: octowatch-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: octowatch-postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: octowatch-postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgresql
    spec:
      # Steer the scheduler away from co-locating this Postgres primary with
      # any worker/beat pod — from this or any other customer namespace
      # sharing the cluster's nodes. Soft (preferred) so Postgres never
      # becomes unschedulable when every node already runs some worker pod,
      # but it discourages the node-contention pattern that caused repeated
      # outages (worker pods competing with the co-located DB for CPU/IO).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - worker-ingestion
                        - worker-detection
                        - worker-baseline
                        - worker-notification
                        - worker-sync
                        - beat
                namespaceSelector: {}
                topologyKey: kubernetes.io/hostname
      # The soft anti-affinity above isn't a hard guarantee — a worker pod
      # re-landed on the same node as a Postgres primary during the 2026-10
      # backlog incident and starved it of CPU. k8s-node-0 carries a
      # `dedicated=database:NoSchedule` taint for exactly this reason;
      # tolerate it so Postgres can still be scheduled there deliberately
      # while every worker/beat pod (which has no matching toleration)
      # physically cannot land on it.
      tolerations:
        - key: dedicated
          operator: Equal
          value: database
          effect: NoSchedule
      securityContext:
        fsGroup: 70
        runAsUser: 70
        runAsNonRoot: true
      containers:
        - name: postgresql
          image: docker.io/timescale/timescaledb:2.25.1-pg16
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: tcp-postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "auditlogs"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: octowatch-db-secret
                  key: postgres-password
            - name: APP_USER
              value: "app_rw"
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: octowatch-db-secret
                  key: app-password
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          {{- $tsdbResources := (.Values.timescaledb | default dict).resources | default dict }}
          {{- $tsdbRequests := $tsdbResources.requests | default dict }}
          {{- $tsdbLimits := $tsdbResources.limits | default dict }}
          resources:
            requests:
              cpu: {{ $tsdbRequests.cpu | default "500m" | quote }}
              memory: {{ $tsdbRequests.memory | default "1Gi" | quote }}
            limits:
              cpu: {{ $tsdbLimits.cpu | default "2000m" | quote }}
              memory: {{ $tsdbLimits.memory | default "4Gi" | quote }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d auditlogs
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d auditlogs
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
            - name: run
              mountPath: /var/run/postgresql
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: init-scripts
          configMap:
            name: octowatch-postgresql-init-scripts
            defaultMode: 0755
        - name: run
          emptyDir: {}
        - name: dshm
          # Default container runtime /dev/shm (64Mi) is too small for
          # TimescaleDB's parallel-query dynamic shared memory segments —
          # under concurrent query load this causes DiskFullError. Size
          # scales with the configured memory limit; override via
          # timescaledb.shmSize for environments with different sizing.
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.timescaledb.shmSize | default "1Gi" }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.timescaledb.storageClass | default "managed-csi" | quote }}
        resources:
          requests:
            storage: {{ .Values.timescaledb.storageSize | default "50Gi" }}
{{- end }}
