# helm/values-large.yaml
# T-shirt size: Large — for high-volume customers
# Suitable for enterprises with 2000+ users / very high audit volume.
# Applied automatically by CI based on namespace label: octowatch.dev/size=large

api:
  replicaCount: 5
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "4000m"
      memory: "4Gi"

worker:
  ingestion:
    replicaCount: 8
    concurrency: 8
    resources:
      requests:
        cpu: "1000m"
        memory: "2Gi"
      limits:
        cpu: "4000m"
        memory: "8Gi"
  detection:
    replicaCount: 8
    concurrency: 16
    resources:
      requests:
        cpu: "2000m"
        memory: "2Gi"
      limits:
        cpu: "8000m"
        memory: "8Gi"
  baseline:
    replicaCount: 4
    concurrency: 8
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
  notification:
    replicaCount: 4
    concurrency: 4
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
  sync:
    replicaCount: 4
    concurrency: 8
    resources:
      requests:
        cpu: "2000m"
        memory: "2Gi"
      limits:
        cpu: "8000m"
        memory: "16Gi"

frontend:
  replicaCount: 5
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

postgresql:
  enabled: false

timescaledb:
  resources:
    requests:
      cpu: "4000m"
      memory: "8Gi"
    limits:
      cpu: "8000m"
      memory: "16Gi"
  persistence:
    size: 200Gi

valkey:
  primary:
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        cpu: "2000m"
        memory: "16Gi"
    persistence:
      size: 32Gi
    extraFlags:
      - "--appendonly yes"
      - "--maxmemory 12gb"
      - "--maxmemory-policy volatile-lru"
