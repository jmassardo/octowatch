# helm/values-medium.yaml
# T-shirt size: Medium — for growing customers
# Suitable for enterprises with 500-2000 users / high audit volume.
# Applied automatically by CI based on namespace label: octowatch.dev/size=medium

api:
  replicaCount: 3
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

worker:
  ingestion:
    replicaCount: 4
    concurrency: 4
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
  detection:
    replicaCount: 4
    concurrency: 8
    resources:
      requests:
        cpu: "1000m"
        memory: "1Gi"
      limits:
        cpu: "4000m"
        memory: "4Gi"
  baseline:
    replicaCount: 2
    concurrency: 4
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
  notification:
    replicaCount: 2
    concurrency: 4
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
  sync:
    replicaCount: 2
    concurrency: 8
    resources:
      requests:
        cpu: "1000m"
        memory: "1Gi"
      limits:
        cpu: "4000m"
        memory: "8Gi"

frontend:
  replicaCount: 3
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

postgresql:
  enabled: false

timescaledb:
  resources:
    requests:
      cpu: "1000m"
      memory: "4Gi"
    limits:
      cpu: "4000m"
      memory: "8Gi"
  persistence:
    size: 100Gi

valkey:
  primary:
    resources:
      requests:
        cpu: "250m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "4Gi"
    persistence:
      size: 16Gi
