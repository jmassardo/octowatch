# helm/values-azure.yaml
# Azure AKS-specific overrides. Merged on top of values.yaml by ArgoCD.

global:
  image:
    registry: ghcr.io/jmassardo

# imagePullSecrets — pre-created by Terraform as ghcr-pull-secret
imagePullSecrets:
  - name: ghcr-pull-secret

# API
api:
  image:
    repository: api

# Worker (all workers use this image) — reduced replicas for single-node AKS dev
worker:
  image:
    repository: worker
  detection:
    replicaCount: 1

# Beat uses its own image
beat:
  image:
    repository: beat

# Frontend
frontend:
  image:
    repository: frontend

# Ingress — nginx class with cert-manager TLS
ingress:
  enabled: true
  className: nginx
  host: octowatch.jmassardo.azure.csa-github.com
  tls:
    enabled: true
    secretName: octowatch-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

# KEDA enabled in AKS
keda:
  enabled: true

# Backup — enable with Azure Blob connection string
backup:
  enabled: true
  schedule: "0 2 * * *"
  bucket: "pg-backups"
  azureStorageAccount: "stoctowatchdevbn3idw"
  retentionDays: 30

# PostgreSQL — Standalone TimescaleDB StatefulSet (bypasses bitnami/postgresql subchart)
# The bitnami chart is incompatible with the timescale/timescaledb community image.
# postgresql.enabled=false disables the bitnami subchart; the custom template in
# helm/templates/timescaledb.yaml deploys TimescaleDB directly.
postgresql:
  enabled: false
  primary:
    persistence:
      storageClass: "managed-csi"
      size: 50Gi
  tls:
    enabled: false

# Valkey — Azure Disk PVC (no read replicas needed in dev — saves ~300m CPU)
valkey:
  replica:
    replicaCount: 0
  primary:
    resources:
      requests:
        cpu: "100m"
        memory: "384Mi"
      limits:
        cpu: "500m"
        memory: "768Mi"
    persistence:
      storageClass: "managed-csi"
      size: 2Gi
  master:
    persistence:
      storageClass: "managed-csi"
      size: 2Gi

# Observability — enable ServiceMonitor (if Prometheus Operator is installed)
observability:
  metrics:
    serviceMonitor:
      enabled: false
useExternalSecrets: true
