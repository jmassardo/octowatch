# helm/values-azure.yaml
# Azure AKS-specific overrides. Merged on top of values.yaml by ArgoCD.

global:
  image:
    registry: ghcr.io/jmassardo

# imagePullSecrets — pre-created by Terraform as ghcr-pull-secret
imagePullSecrets:
  - name: ghcr-pull-secret

# API
api:
  image:
    repository: api

# Worker (all workers use this image) — scale limits for AKS dev
worker:
  image:
    repository: worker
  ingestion:
    replicaCount: 4
  detection:
    replicaCount: 4
  notification:
    replicaCount: 2
  baseline:
    replicaCount: 2

# Beat uses its own image
beat:
  image:
    repository: beat

# Frontend
frontend:
  image:
    repository: frontend

# Ingress — nginx class with cert-manager TLS
ingress:
  enabled: true
  className: nginx
  host: octowatch.jmassardo.azure.csa-github.com
  tls:
    enabled: true
    secretName: octowatch-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
  rateLimits:
    default:
      rps: "30"
      connections: "30"
      burstMultiplier: "3"
    hec:
      rps: "50"
      connections: "20"
      burstMultiplier: "5"
      proxyBodySize: "5m"
    webhook:
      rps: "30"
      connections: "10"
      burstMultiplier: "3"
      proxyBodySize: "2m"

# KEDA enabled in AKS
keda:
  enabled: true

# Backup — enable with Azure Blob connection string
backup:
  enabled: true
  schedule: "0 2 * * *"
  bucket: "pg-backups"
  azureStorageAccount: "stoctowatchdevbn3idw"
  retentionDays: 30

# PostgreSQL — Standalone TimescaleDB StatefulSet (bypasses bitnami/postgresql subchart)
# The bitnami chart is incompatible with the timescale/timescaledb community image.
# postgresql.enabled=false disables the bitnami subchart; the custom template in
# helm/templates/timescaledb.yaml deploys TimescaleDB directly.
postgresql:
  enabled: false
  primary:
    persistence:
      storageClass: "managed-csi"
      size: 50Gi
  tls:
    enabled: false

# Valkey — Azure Disk PVC (1 replica for HA — prevents data loss on primary pod eviction)
valkey:
  replica:
    replicaCount: 1
  primary:
    resourcesPreset: "none"
    resources:
      requests:
        cpu: "100m"
        memory: "384Mi"
      limits:
        cpu: "500m"
        memory: "768Mi"
    persistence:
      storageClass: "managed-csi"
      size: 2Gi
    extraFlags:
      - "--appendonly yes"
      - "--maxmemory 512mb"
      - "--maxmemory-policy volatile-lru"
  master:
    persistence:
      storageClass: "managed-csi"
      size: 2Gi

# Observability — enable ServiceMonitor (if Prometheus Operator is installed)
observability:
  metrics:
    serviceMonitor:
      enabled: false
useExternalSecrets: true

# ---------------------------------------------------------------------------
# Azure Workload Identity + Key Vault (Issue #135)
# Populate clientId/tenantId from terraform output after apply.
# ---------------------------------------------------------------------------
workloadIdentity:
  enabled: true
  clientId: ""   # TODO: populate from `terraform output workload_identity_client_id`
  tenantId: ""   # TODO: populate from `terraform output workload_identity_tenant_id`

keyVault:
  name: ""       # TODO: populate from terraform locals (e.g., kv-oct-dev-XXXXXX)
  uri: ""        # TODO: populate from `terraform output key_vault_uri`
