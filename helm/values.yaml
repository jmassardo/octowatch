# octowatch Helm Chart — Values
# See docs/security-and-deployment.md for full environment variable reference
# and security architecture details.

# ---------------------------------------------------------------------------
# Global settings — shared across all chart subcharts and templates
# ---------------------------------------------------------------------------
global:
  image:
    # Container registry prefix, e.g. "ghcr.io/your-org" or "registry.example.com"
    registry: ghcr.io/your-org
    # Application image tag; override per environment (CI sets this to git SHA)
    tag: "latest"

# ---------------------------------------------------------------------------
# Service Account
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: true

# ---------------------------------------------------------------------------
# Network Policy — restricts pod-to-pod traffic to required paths only
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: false
  # Namespace where the ingress controller runs (for NetworkPolicy ingress rules)
  ingressNamespace: ingress-nginx

# imagePullSecrets for GHCR — populated in values-azure.yaml
imagePullSecrets: []

# KEDA autoscaling for workers
keda:
  enabled: false

# ---------------------------------------------------------------------------
# API service
# ---------------------------------------------------------------------------
api:
  replicaCount: 2  # Increase for high availability; requires shared session via Valkey

  image:
    repository: octowatch-api
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  # Pod-level security context — applied to all containers in the API pod
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1001
    capabilities:
      drop: ["ALL"]

  service:
    type: ClusterIP
    port: 8000

  # See docs/security-and-deployment.md §3 for full probe definitions
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /ready
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /health
      port: 8000
    failureThreshold: 30
    periodSeconds: 10
    timeoutSeconds: 5

# ---------------------------------------------------------------------------
# HEC — dedicated Splunk HEC ingestion pods (optional, off by default)
# When enabled, HEC traffic goes to separate pods; API pods no longer serve HEC.
# ---------------------------------------------------------------------------
hec:
  enabled: false
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# ---------------------------------------------------------------------------
# Celery workers
# ---------------------------------------------------------------------------
worker:
  image:
    repository: octowatch-worker
    pullPolicy: IfNotPresent

  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1001
    capabilities:
      drop: ["ALL"]

  ingestion:
    replicaCount: 1   # Scale up when ingesting multiple concurrent sources
    concurrency: 4    # Celery worker processes per replica (-c flag)
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"  # Extra memory headroom for gzip decompression of large audit files

  detection:
    replicaCount: 2   # Scale out for high event volume; detection is stateless
    concurrency: 8    # CPU-bound rule evaluation; tune to (vCPUs * 2)
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"

  baseline:
    replicaCount: 1   # Baseline recomputation is idempotent; single replica is fine
    concurrency: 2    # I/O-bound; low concurrency avoids DB pressure
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

  notification:
    replicaCount: 1   # Notification fanout; scales with alert volume
    concurrency: 2    # I/O-bound (Slack, SMTP, Jira); keep concurrency low
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

  sync:
    replicaCount: 1
    concurrency: 4
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "4Gi"

# ---------------------------------------------------------------------------
# Celery Beat scheduler
# CRITICAL: replicaCount is fixed at 1 and must not be changed.
# Multiple beat instances cause duplicate task scheduling.
# ---------------------------------------------------------------------------
beat:
  # replicaCount is intentionally not exposed — always 1; see worker comment above
  image:
    repository: beat
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

# ---------------------------------------------------------------------------
# Frontend (React SPA)
# ---------------------------------------------------------------------------
frontend:
  replicaCount: 2

  image:
    repository: octowatch-frontend
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

  service:
    type: ClusterIP
    port: 3001

# ---------------------------------------------------------------------------
# PostgreSQL — Bitnami PostgreSQL subchart
# For production, consider TimescaleDB-managed chart or external RDS.
# See docs/security-and-deployment.md §1.2 for DB TLS requirements.
# ---------------------------------------------------------------------------
postgresql:
  enabled: true  # Set to false to use an external PostgreSQL instance

  auth:
    username: app_rw
    database: auditlogs
    # Password is injected via existingSecret; see secrets management below
    # See docs/security-and-deployment.md for env var details
    existingSecret: octowatch-db-secret
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: app-password

  primary:
    image:
      registry: docker.io
      repository: timescale/timescaledb
      tag: "2.25.1-pg16"

    persistence:
      enabled: true
      size: 50Gi  # Adjust based on event volume; TimescaleDB compression yields ~90% reduction

    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"

    # PostgreSQL tuning for OLAP / TimescaleDB aggregate workloads.
    # Assumes 4 Gi memory limit; adjust proportionally when scaling.
    extendedConfiguration: |
      shared_buffers = '1GB'
      work_mem = '32MB'
      maintenance_work_mem = '256MB'
      effective_cache_size = '3GB'
      random_page_cost = 1.1
      jit = off
      max_parallel_workers_per_gather = 4
      max_parallel_workers = 8

    # Enable TimescaleDB extension (requires timescale/timescaledb image override)
    initdb:
      scripts:
        enable_timescaledb.sql: |
          CREATE EXTENSION IF NOT EXISTS timescaledb;

  # sslmode=require enforced in DATABASE_URL env var — not configurable here
  tls:
    enabled: true
    autoGenerated: true

# ---------------------------------------------------------------------------
# Valkey — community Valkey subchart (or Redis-compatible subchart)
# See docs/security-and-deployment.md for env var details
# ---------------------------------------------------------------------------
valkey:
  enabled: true  # Set to false to use an external Valkey/Redis instance

  auth:
    enabled: true
    # Password injected via existingSecret
    existingSecret: octowatch-valkey-secret
    existingSecretPasswordKey: valkey-password

  master:
    persistence:
      enabled: true
      size: 2Gi  # Valkey stores sessions, dedup keys, and Celery results

    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

    # Append-only file persistence for durability (session loss on restart is acceptable
    # but dedup state loss would cause re-ingestion of duplicate events)
    extraFlags:
      - "--appendonly yes"
      - "--maxmemory 512mb"
      - "--maxmemory-policy volatile-lru"

# ---------------------------------------------------------------------------
# Ingress — routes external traffic to nginx / api / frontend
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx  # Ingress controller class; change to "traefik" etc. as needed

  host: octowatch.example.com  # Replace with your actual FQDN

  tls:
    enabled: true
    secretName: octowatch-tls  # TLS certificate secret (cert-manager or manual)

  # Annotations for cert-manager automatic TLS certificate provisioning
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"

  # Per-path rate limits (applied via separate ingress resources)
  rateLimits:
    default:
      rps: "30"
      connections: "30"
      burstMultiplier: "3"
    hec:
      rps: "50"
      connections: "20"
      burstMultiplier: "5"
      proxyBodySize: "5m"
    webhook:
      rps: "30"
      connections: "10"
      burstMultiplier: "3"
      proxyBodySize: "2m"

# ---------------------------------------------------------------------------
# GitHub-backed detection rule storage (optional)
# Leave repo empty to disable rule sync — rules still fully work in the DB.
# ---------------------------------------------------------------------------
githubRules:
  repo: ""          # e.g. my-org/audit-detection-rules
  branch: main      # Branch to commit rule YAML files to
  # Token injected via secret key "github-rules-token" (optional)

# ---------------------------------------------------------------------------
# Ingestion mode and storage backend configuration
# ---------------------------------------------------------------------------
ingestion:
  # Active backend: hec | s3 | azure_blob
  mode: hec

  # AWS S3 settings — only used when mode=s3
  s3:
    bucket: ""          # Name of the S3 bucket containing GitHub audit logs
    region: us-east-1   # AWS region of the S3 bucket
    # Credentials injected via existingSecret (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)
    existingSecret: octowatch-s3-secret

  # Azure Blob settings — only used when mode=azure_blob
  azureBlob:
    containerName: ""   # Azure Blob container name
    # Connection string injected via existingSecret (AZURE_STORAGE_CONNECTION_STRING)
    existingSecret: octowatch-azure-secret

# ---------------------------------------------------------------------------
# Detection engine tuning
# ---------------------------------------------------------------------------
detection:
  impossibleTravel:
    # Speed threshold in km/h above which two consecutive logins from different
    # locations are flagged as impossible travel. Default: 900 km/h (roughly
    # commercial aircraft cruising speed, allowing legitimate air travelers).
    thresholdKmh: 900

  behavioralBaseline:
    # Rolling window in days used by the baseline recomputation job.
    # Longer windows produce more stable baselines but respond more slowly
    # to legitimate behaviour changes (e.g., new team members).
    windowDays: 30

  # Minimum confidence score (0.0–1.0) for a detection to be persisted
  # and trigger downstream notifications / ticket creation.
  confidenceThreshold: 0.7

# ---------------------------------------------------------------------------
# Security settings
# ---------------------------------------------------------------------------
security:
  # JWT session TTL in seconds. Default: 3600 (1 hour).
  # Valkey session key TTL is synchronized to this value.
  # Shorter TTLs reduce the impact of token theft.
  jwtTtlSeconds: 3600

  # Rate limit for authentication endpoints (login, SAML ACS) per IP per minute.
  # Mitigates brute-force and credential stuffing against the OAuth flow.
  rateLimitAuthPerMinute: 10

  # Rate limit for read API endpoints per authenticated user per minute.
  rateLimitReadPerMinute: 60

  # Rate limit for write API endpoints per authenticated user per minute.
  rateLimitWritePerMinute: 10

  # Maximum number of rows the self-service SQL query engine may return per query.
  queryMaxRows: 100000

  # Server-side timeout in seconds for self-service SQL queries.
  queryTimeoutSeconds: 30

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
observability:
  logLevel: INFO  # DEBUG | INFO | WARNING | ERROR

  # Prometheus metrics scraping
  metrics:
    enabled: true
    port: 9090
    path: /metrics
    # ServiceMonitor CRD for Prometheus Operator — opt-in
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s

  # OpenTelemetry trace export (optional)
  tracing:
    enabled: false
    endpoint: ""  # OTLP gRPC endpoint, e.g. "http://otel-collector:4317"

# ---------------------------------------------------------------------------
# Database Backup — automated CronJob for TimescaleDB backups to S3
# Set backup.enabled=true and configure bucket/schedule to activate.
# ---------------------------------------------------------------------------
backup:
  enabled: false
  schedule: "0 2 * * *"           # Daily at 02:00 UTC
  bucket: "octowatch-backups"     # S3 bucket for backup storage
  retentionDays: 30               # Number of days to retain backup files
  image: timescale/timescaledb:2.25.1-pg16
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# ---------------------------------------------------------------------------
# Azure Workload Identity — enables pods to authenticate to Azure Key Vault
# without stored credentials (via OIDC federation with AKS).
# ---------------------------------------------------------------------------
workloadIdentity:
  enabled: false
  clientId: ""     # Azure managed identity client ID (from terraform output)
  tenantId: ""     # Azure AD tenant ID (from terraform output)

# ---------------------------------------------------------------------------
# Azure Key Vault — application secret storage
# ---------------------------------------------------------------------------
keyVault:
  name: ""         # Key Vault name (e.g., kv-octowatch-prod)
  uri: ""          # Full vault URI (e.g., https://kv-octowatch-prod.vault.azure.net/)

# ---------------------------------------------------------------------------
# cert-manager — Wildcard TLS via Cloudflare DNS-01
# Deploy once per cluster (platform release). Provides *.octowatch.dev wildcard
# cert shared by all customer ingresses. Do NOT enable in per-customer releases.
# ---------------------------------------------------------------------------
certManager:
  enabled: false
  acmeEmail: ""    # Email for Let's Encrypt account notifications
  certificateNamespace: ingress-nginx
  cloudflare:
    apiTokenSecretName: cloudflare-api-token
    apiTokenSecretKey: api-token
    dnsZones:
      - octowatch.dev

# ---------------------------------------------------------------------------
# Setup wizard — post-completion behavior
# ---------------------------------------------------------------------------
setup:
  # When true, creates RBAC resources that allow the API pod to trigger
  # a rolling restart of all OctoWatch deployments after setup completes.
  restartAfterComplete: true

# ---------------------------------------------------------------------------
# Stakater Reloader — auto-restart pods on Secret/ConfigMap changes
# ---------------------------------------------------------------------------
reloader:
  # Requires Stakater Reloader to be installed on the cluster.
  # When enabled, deployments get `reloader.stakater.com/auto: "true"` annotation.
  enabled: true
