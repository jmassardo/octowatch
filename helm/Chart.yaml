apiVersion: v2
name: audit-log-analyzer
description: >
  GitHub Enterprise Cloud audit log ingestion, detection, and reporting platform.
  FastAPI backend, Celery workers, TimescaleDB, Valkey, MinIO, Gitea.

type: application
version: 0.1.0
appVersion: "0.1.0"

home: https://github.com/your-org/audit-log-analyzer
sources:
  - https://github.com/your-org/audit-log-analyzer

keywords:
  - audit
  - security
  - github
  - siem

maintainers:
  - name: Platform Team
    email: platform@example.com

dependencies:
  # PostgreSQL 16 + TimescaleDB — set postgresql.enabled=false to use external DB
  - name: postgresql
    version: "15.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled

  # Valkey 7.2 (BSD-3 Redis fork) — set valkey.enabled=false to use external instance
  - name: valkey
    version: "2.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: valkey.enabled

  # MinIO — set minio.enabled=false to use external S3/MinIO endpoint
  - name: minio
    version: "5.x.x"
    repository: https://charts.min.io/
    condition: minio.enabled
