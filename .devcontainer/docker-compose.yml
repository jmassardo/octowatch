services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    env_file:
      - path: .env
        required: false
    volumes:
      - ..:/workspaces/octowatch:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql+asyncpg://appuser:devpass@db:5432/audit_logs
      VALKEY_URL: redis://:devpass@valkey:6379/0
      SECRET_KEY: devcontainer-secret-key-not-for-production
      ENCRYPTION_KEY: devcontainer-encryption-key-000000000000
      LOG_LEVEL: DEBUG
      ENVIRONMENT: development
      INGESTION_MODE: hec
      GITHUB_CLIENT_ID: ""
      GITHUB_CLIENT_SECRET: ""
      GITHUB_RULES_REPO: ""
      GITHUB_RULES_TOKEN: ""
      DETECTION_CONFIDENCE_THRESHOLD: "0.7"
      QUERY_MAX_ROWS: "100000"
      QUERY_TIMEOUT_SECONDS: "30"
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      CODESPACE_NAME: ${CODESPACE_NAME:-}
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  db:
    image: timescale/timescaledb:2.25.1-pg16
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: audit_logs
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d audit_logs"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  valkey:
    image: valkey/valkey:9.0.3-alpine
    command:
      - valkey-server
      - --requirepass
      - devpass
      - --appendonly
      - "yes"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "devpass", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pg_data:
  valkey_data:
