################################################################################
# OctoWatch — Provision Customer Namespace
#
# Creates a new customer namespace with proper labels and annotations for the
# multi-tenant deploy pipeline to discover and deploy to.
#
# Usage: Trigger manually via workflow_dispatch with customer details.
################################################################################
name: Provision Customer

on:
  workflow_dispatch:
    inputs:
      customer_slug:
        description: "Customer identifier (lowercase, alphanumeric + hyphens, e.g. 'octodemo')"
        required: true
        type: string
      ring:
        description: "Deployment ring"
        required: true
        type: choice
        options:
          - test
          - preview
          - prod
      size:
        description: "T-shirt size for resource allocation"
        required: true
        type: choice
        options:
          - small
          - medium
          - large

jobs:
  provision:
    name: "Provision: ${{ inputs.customer_slug }}"
    runs-on: [self-hosted, k8s-mgmt]
    permissions:
      contents: read

    env:
      NAMESPACE: "octowatch-${{ inputs.customer_slug }}"

    steps:
      - name: Validate customer slug
        run: |
          SLUG="${{ inputs.customer_slug }}"
          if [[ ! "$SLUG" =~ ^[a-z][a-z0-9-]{1,20}$ ]]; then
            echo "::error::Invalid customer_slug: must be lowercase alphanumeric with hyphens, 2-21 chars, starting with a letter."
            exit 1
          fi

      - name: Check if namespace already exists
        id: check
        run: |
          if kubectl get namespace "$NAMESPACE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Namespace $NAMESPACE already exists. Will update labels/annotations."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create namespace
        if: steps.check.outputs.exists == 'false'
        run: |
          kubectl create namespace "$NAMESPACE"
          echo "✅ Created namespace: $NAMESPACE"

      - name: Apply labels and annotations
        run: |
          kubectl label namespace "$NAMESPACE" --overwrite \
            "octowatch.dev/customer=${{ inputs.customer_slug }}" \
            "octowatch.dev/ring=${{ inputs.ring }}" \
            "octowatch.dev/size=${{ inputs.size }}" \
            "app.kubernetes.io/part-of=octowatch"

          kubectl annotate namespace "$NAMESPACE" --overwrite \
            "octowatch.dev/provisioned-by=github-actions" \
            "octowatch.dev/provisioned-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "✅ Labels and annotations applied"

      - name: Copy image pull secret
        run: |
          # Copy ghcr-pull-secret from the octowatch namespace (source of truth)
          if kubectl get secret ghcr-pull-secret -n octowatch >/dev/null 2>&1; then
            kubectl get secret ghcr-pull-secret -n octowatch -o json | \
              jq 'del(.metadata.namespace, .metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp)' | \
              kubectl apply -n "$NAMESPACE" -f -
            echo "✅ Image pull secret copied from octowatch namespace"
          else
            echo "::warning::ghcr-pull-secret not found in octowatch namespace. Pods won't be able to pull images until this is created."
          fi

      - name: Generate application secrets
        run: |
          RELEASE_NAME="$NAMESPACE"
          DB_PASSWORD=$(openssl rand -base64 32 | tr -d '/+=' | head -c 32)
          SECRET_KEY=$(openssl rand -base64 48 | tr -d '/+=' | head -c 48)
          ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '/+=' | head -c 32)

          # Database secret (used by TimescaleDB StatefulSet)
          kubectl create secret generic octowatch-db-secret \
            -n "$NAMESPACE" \
            --from-literal=postgres-password="$DB_PASSWORD" \
            --from-literal=app-password="$DB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Valkey auth secret (used by Valkey subchart)
          VALKEY_PASSWORD=$(openssl rand -base64 32 | tr -d '/+=' | head -c 32)
          kubectl create secret generic octowatch-valkey-secret \
            -n "$NAMESPACE" \
            --from-literal=valkey-password="$VALKEY_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Application secret (used by API/worker deployments)
          DATABASE_URL="postgresql+asyncpg://app_rw:${DB_PASSWORD}@${RELEASE_NAME}-postgresql:5432/auditlogs?sslmode=disable"
          VALKEY_URL="redis://:${VALKEY_PASSWORD}@${RELEASE_NAME}-valkey-primary:6379"

          kubectl create secret generic "${RELEASE_NAME}-secrets" \
            -n "$NAMESPACE" \
            --from-literal=secret-key="$SECRET_KEY" \
            --from-literal=encryption-key="$ENCRYPTION_KEY" \
            --from-literal=database-url="$DATABASE_URL" \
            --from-literal=valkey-url="$VALKEY_URL" \
            --from-literal=github-client-id="" \
            --from-literal=github-client-secret="" \
            --from-literal=github-rules-token="" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "✅ Application secrets generated (GitHub credentials left blank for setup wizard)"

      - name: Apply bootstrap NetworkPolicy (default deny until Helm deploys)
        run: |
          cat <<'EOF' | kubectl apply -n "$NAMESPACE" -f -
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: bootstrap-default-deny
            labels:
              octowatch.dev/lifecycle: bootstrap
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
              - Egress
          ---
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: bootstrap-allow-dns
            labels:
              octowatch.dev/lifecycle: bootstrap
          spec:
            podSelector: {}
            policyTypes:
              - Egress
            egress:
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: kube-system
                ports:
                  - protocol: UDP
                    port: 53
                  - protocol: TCP
                    port: 53
          EOF
          echo "✅ Bootstrap NetworkPolicies applied (will be superseded by Helm)"

      - name: Verify namespace
        run: |
          echo "=== Namespace Details ==="
          kubectl get namespace "$NAMESPACE" -o yaml
          echo ""
          echo "=== NetworkPolicies ==="
          kubectl get networkpolicies -n "$NAMESPACE"
          echo ""
          echo "🎉 Customer '${{ inputs.customer_slug }}' provisioned in ring '${{ inputs.ring }}' (size: ${{ inputs.size }})"
          echo ""
          echo "Next steps:"
          echo "  1. Add any required secrets to the namespace"
          echo "  2. Trigger the Deploy (Multi-Tenant) workflow to deploy the app"
          echo "  3. Set up DNS: ${{ inputs.customer_slug }}.octowatch.dev → cluster ingress IP"
