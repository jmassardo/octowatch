# =============================================================================
# CI — Pull Request Validation
#
# Runs lint, type checking, unit tests, and E2E tests on pull requests.
# This is the only gate before merge — no redundant re-runs on main.
# =============================================================================
name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Stage 1: Quick checks (lint + type-check run in parallel)
  # ─────────────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
        working-directory: backend
      - name: Format check
        run: ruff format --check .
        working-directory: backend

  backend-typecheck:
    name: Backend Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps + mypy
        run: pip install -e ".[dev]" mypy
        working-directory: backend
      - name: Type check (non-blocking — pre-existing annotation errors)
        run: mypy app/ --ignore-missing-imports --no-error-summary || true
        working-directory: backend

  frontend-lint:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Format check
        run: npm run format:check
        working-directory: frontend

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 2: Tests
  # ─────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    needs: [backend-lint]
    services:
      postgres:
        image: timescale/timescaledb:2.14.2-pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: audit_log_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:7.2-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install -e ".[dev]"
        working-directory: backend
      - name: Run tests with coverage
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-fail-under=10
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/audit_log_test
          VALKEY_URL: redis://localhost:6379/0
          SECRET_KEY: testsecretkey_for_unit_tests_only_32ch
          INGESTION_MODE: hec
          GEOIP_DB_PATH: /tmp/GeoLite2-City.mmdb
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-xml
          path: backend/coverage.xml
          retention-days: 7

  frontend-test:
    name: Frontend Tests (vitest)
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Run tests
        run: npm test
        working-directory: frontend

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 3: E2E tests (full-stack integration)
  # ─────────────────────────────────────────────────────────────────────────
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Start stack
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql+asyncpg://test:test@db:5432/auditlogs
          POSTGRES_USER=test
          POSTGRES_PASSWORD=test
          POSTGRES_DB=auditlogs
          VALKEY_URL=redis://:test@valkey:6379/0
          VALKEY_PASSWORD=test
          SECRET_KEY=e2e-test-secret-key-not-for-production
          INGESTION_MODE=hec
          GEOIP_DB_PATH=/tmp/GeoLite2-City.mmdb
          GITHUB_CLIENT_ID=dummy
          GITHUB_CLIENT_SECRET=dummy
          APP_BASE_URL=http://localhost
          GITHUB_RULES_REPO=
          GITHUB_RULES_TOKEN=
          LOG_LEVEL=WARNING
          EOF
          sed -i 's/^          //' .env
          docker build --target production -t octowatch-api:latest backend/
          docker build --target worker -t octowatch-worker:latest backend/
          docker build -t octowatch-frontend:latest frontend/
          mkdir -p nginx/ssl
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout nginx/ssl/key.pem -out nginx/ssl/cert.pem \
            -subj "/CN=localhost" 2>/dev/null
          docker compose up -d db valkey
          sleep 15
          docker compose run --rm migrate || true
          docker compose exec -T db psql -U test -d auditlogs -c \
            "UPDATE auth_method_configs SET enabled = true WHERE method_name = 'local_password';" || true
          docker compose up -d api frontend nginx
          sleep 10
      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -skf https://localhost/health; then
              echo "API is healthy"
              break
            fi
            echo "Waiting for API... attempt $i"
            sleep 5
          done
      - name: Smoke tests
        run: |
          curl -skf https://localhost/health | jq .
          curl -skf https://localhost/ready || echo "Ready check returned non-200 (dependency may be missing in CI)"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=list
        working-directory: frontend
        env:
          BASE_URL: https://localhost
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          E2E_USER: admin
          E2E_PASS: admin
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=100
