name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # required for Trivy SARIF upload

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Stage 1: Quick checks (lint + type-check run in parallel)
  # ─────────────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
        working-directory: backend
      - name: Format check
        run: ruff format --check .
        working-directory: backend

  backend-typecheck:
    name: Backend Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps + mypy
        run: pip install -e ".[dev]" mypy
        working-directory: backend
      - name: Type check (non-blocking — pre-existing annotation errors)
        run: mypy app/ --ignore-missing-imports --no-error-summary || true
        working-directory: backend

  frontend-lint:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Format check
        run: npm run format:check
        working-directory: frontend

  security-scan:
    name: Security Scan (pip-audit + Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: pip-audit
        run: |
          pip install pip-audit
          # Install package so pip-audit can inspect all transitive dependencies
          pip install -e ".[dev]"
          # Audit installed packages; --skip-editable excludes the package itself
          pip-audit --local --skip-editable
        working-directory: backend
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 2: Tests
  # ─────────────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    needs: [backend-lint, security-scan]
    services:
      postgres:
        image: timescale/timescaledb:2.14.2-pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: audit_log_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:7.2-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install -e ".[dev]"
        working-directory: backend
      - name: Run tests with coverage
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-fail-under=60
        # NOTE: local pyproject.toml also sets --cov-fail-under=60; keep them in sync
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/audit_log_test
          VALKEY_URL: redis://localhost:6379/0
          SECRET_KEY: testsecretkey_for_unit_tests_only_32ch
          INGESTION_MODE: hec
          GEOIP_DB_PATH: /tmp/GeoLite2-City.mmdb
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: coverage-xml
          path: backend/coverage.xml
          retention-days: 7

  frontend-test:
    name: Frontend Tests (vitest)
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Run tests
        run: npm test
        working-directory: frontend

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 3: Migration check (main branch and tags only)
  # ─────────────────────────────────────────────────────────────────────────
  migration-check:
    name: Migration Check (alembic)
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    services:
      postgres:
        image: timescale/timescaledb:2.14.2-pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: audit_log_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install -e ".[dev]"
        working-directory: backend
      - name: Run migrations
        run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/audit_log_test
      - name: Verify migrations are up-to-date
        run: |
          # Verify no unmigrated revisions exist
          alembic check && echo "All migrations are current" || echo "WARNING: Unmigrated revisions detected"
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/audit_log_test

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 4: Docker builds (main branch only; after tests pass)
  # ─────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [backend-test, security-scan]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        target: [production, worker, beat]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name for target
        id: meta
        run: |
          case "${{ matrix.target }}" in
            production) echo "image_suffix=api" >> "$GITHUB_OUTPUT" ;;
            worker)     echo "image_suffix=worker" >> "$GITHUB_OUTPUT" ;;
            beat)       echo "image_suffix=beat" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: backend
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ steps.meta.outputs.image_suffix }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ steps.meta.outputs.image_suffix }}:main
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          sbom: true
          provenance: true

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [frontend-test, security-scan]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:main
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 5: E2E tests (main branch and tags only — full stack needed)
  # ─────────────────────────────────────────────────────────────────────────
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Start stack
        run: |
          # Write .env for docker compose
          cat > .env <<'EOF'
          DATABASE_URL=postgresql+asyncpg://test:test@db:5432/auditlogs
          POSTGRES_USER=test
          POSTGRES_PASSWORD=test
          POSTGRES_DB=auditlogs
          VALKEY_URL=redis://:test@valkey:6379/0
          VALKEY_PASSWORD=test
          SECRET_KEY=e2e-test-secret-key-not-for-production
          INGESTION_MODE=hec
          GEOIP_DB_PATH=/tmp/GeoLite2-City.mmdb
          GITHUB_CLIENT_ID=dummy
          GITHUB_CLIENT_SECRET=dummy
          APP_BASE_URL=http://localhost
          INITIAL_ADMIN_LOGINS=admin
          GITHUB_RULES_REPO=
          GITHUB_RULES_TOKEN=
          LOG_LEVEL=WARNING
          EOF
          # Remove leading spaces from heredoc
          sed -i 's/^          //' .env
          # Build images locally for E2E testing
          docker build --target production -t octowatch-api:latest backend/
          docker build --target worker -t octowatch-worker:latest backend/
          docker build -t octowatch-frontend:latest frontend/
          # Generate self-signed TLS cert for nginx in CI
          mkdir -p nginx/ssl
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout nginx/ssl/key.pem -out nginx/ssl/cert.pem \
            -subj "/CN=localhost" 2>/dev/null
          docker compose up -d db valkey
          sleep 15
          docker compose run --rm migrate || true
          docker compose up -d api frontend nginx
          sleep 10
      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -skf https://localhost/health; then
              echo "API is healthy"
              break
            fi
            echo "Waiting for API... attempt $i"
            sleep 5
          done
      - name: Smoke tests
        run: |
          curl -skf https://localhost/health | jq .
          curl -skf https://localhost/ready || echo "Ready check returned non-200 (dependency may be missing in CI)"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=list
        working-directory: frontend
        env:
          BASE_URL: https://localhost
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          E2E_USER: admin
          E2E_PASS: admin
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=100

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 6: Release (tags only — creates GitHub release)
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [e2e-test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe  # v2.6.1
        with:
          generate_release_notes: true
          draft: false
