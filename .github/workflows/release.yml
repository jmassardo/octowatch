# =============================================================================
# Release — Build, version, and publish on merge to main
#
# Triggers on every push to main. Determines the next semantic version from
# conventional commit messages, builds Docker images, pushes to GHCR, and
# creates a GitHub Release with the Helm chart attached.
#
# Version bumps:
#   fix:  → patch (1.0.0 → 1.0.1)
#   feat: → minor (1.0.0 → 1.1.0)
#   feat!: / BREAKING CHANGE: → major (1.0.0 → 2.0.0)
#   perf:/chore:/docs:/etc → patch
# =============================================================================
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "*.md"

  workflow_dispatch:
    inputs:
      version_override:
        description: "Override version (e.g., v2.0.0). Leave empty for auto-increment."
        required: false
        default: ""

# Serialize releases to prevent tag races from rapid merges
concurrency:
  group: release-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: write
  packages: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Determine next semantic version
  # ─────────────────────────────────────────────────────────────────────────
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate next version
        id: version
        env:
          VERSION_OVERRIDE: ${{ github.event.inputs.version_override }}
        run: |
          set -euo pipefail

          if [ -n "${VERSION_OVERRIDE:-}" ]; then
            TAG="${VERSION_OVERRIDE}"
            echo "Using manual override: ${TAG}"
          else
            # Get latest semver tag
            if LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null); then
              RANGE="${LATEST_TAG}..HEAD"
              echo "Latest tag: ${LATEST_TAG}"
            else
              LATEST_TAG="v0.0.0"
              RANGE="HEAD"
              echo "No previous tag found, starting from v0.0.0"
            fi

            # Parse current version
            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"

            # Scan commits since last tag (full message for BREAKING CHANGE in body)
            COMMITS=$(git log "${RANGE}" --format='%s%n%b' 2>/dev/null || git log --format='%s%n%b')

            # Determine bump type
            if echo "$COMMITS" | grep -qE '^[a-zA-Z]+(\(.+\))?!:' || echo "$COMMITS" | grep -q 'BREAKING CHANGE:'; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              echo "Bump: MAJOR (breaking change detected)"
            elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
              MINOR=$((MINOR + 1))
              PATCH=0
              echo "Bump: MINOR (new feature detected)"
            else
              PATCH=$((PATCH + 1))
              echo "Bump: PATCH (fixes/chores only)"
            fi

            TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          # Safety: ensure tag doesn't already exist
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists! Aborting."
            exit 1
          fi

          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "📦 Next release: ${TAG}"

  # ─────────────────────────────────────────────────────────────────────────
  # Migration check (validate Alembic migrations apply cleanly)
  # ─────────────────────────────────────────────────────────────────────────
  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    needs: [version]
    continue-on-error: true
    services:
      postgres:
        image: timescale/timescaledb:2.14.2-pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: audit_log_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install -e ".[dev]"
        working-directory: backend
      - name: Run migrations
        run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/audit_log_test
      - name: Verify no pending migrations
        run: alembic check && echo "✓ All migrations current" || echo "⚠ Unmigrated revisions detected"
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/audit_log_test

  # ─────────────────────────────────────────────────────────────────────────
  # Build and push Docker images
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: octowatch-api
            context: backend
            target: production
          - name: octowatch-worker
            context: backend
            target: worker
          - name: octowatch-beat
            context: backend
            target: beat
          - name: octowatch-frontend
            context: frontend
            target: ""

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          target: ${{ matrix.image.target || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          sbom: true
          provenance: true

  # ─────────────────────────────────────────────────────────────────────────
  # Create git tag and GitHub Release
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [version, build, migration-check]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Package Helm chart
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add gitea https://dl.gitea.io/charts/
          helm repo update
          helm dependency update helm/
          helm package helm/ --version "${{ needs.version.outputs.version }}" \
            --app-version "${{ needs.version.outputs.tag }}" \
            --destination dist/

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" -m "Release ${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          files: dist/*.tgz
          append_body: true
          body: |

            ## Container Images

            ```bash
            docker pull ${{ env.IMAGE_PREFIX }}/octowatch-api:${{ needs.version.outputs.tag }}
            docker pull ${{ env.IMAGE_PREFIX }}/octowatch-worker:${{ needs.version.outputs.tag }}
            docker pull ${{ env.IMAGE_PREFIX }}/octowatch-beat:${{ needs.version.outputs.tag }}
            docker pull ${{ env.IMAGE_PREFIX }}/octowatch-frontend:${{ needs.version.outputs.tag }}
            ```

      - name: Write version file
        run: echo "${{ needs.version.outputs.tag }}" > version.txt

      - name: Upload version artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-version
          path: version.txt
          retention-days: 7
