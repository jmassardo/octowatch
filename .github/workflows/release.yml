name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Only one release job runs at a time; no cancellation (release is important)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Build + push all Docker images tagged with the git tag and latest
  # ─────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push (${{ matrix.config.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: api
            context: backend
            target: production
          - name: worker
            context: backend
            target: worker
          - name: beat
            context: backend
            target: beat
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294  # v7.0.0
        with:
          context: ${{ matrix.config.context }}
          target: ${{ matrix.config.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.config.name }}:${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository }}/${{ matrix.config.name }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.config.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.config.name }}
          sbom: true
          provenance: true

  build-and-push-frontend:
    name: Build & Push (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Check for frontend Dockerfile
        id: check
        run: |
          if [ -f frontend/Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
        if: steps.check.outputs.exists == 'true'
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        if: steps.check.outputs.exists == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294  # v7.0.0
        if: steps.check.outputs.exists == 'true'
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository }}/frontend:latest
          labels: |
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ─────────────────────────────────────────────────────────────────────────
  # Package Helm chart and attach to GitHub Release
  # ─────────────────────────────────────────────────────────────────────────
  helm-package:
    name: Package Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Add Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add gitea https://dl.gitea.io/charts/
          helm repo add minio https://charts.min.io/
          helm repo update
      - name: Package chart
        run: |
          helm dependency update helm/
          helm package helm/ --destination dist/
      - name: Upload chart artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: helm-chart
          path: dist/*.tgz
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────
  # Create the GitHub Release with changelog and Helm chart attachment
  # ─────────────────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push, build-and-push-frontend, helm-package]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Download Helm chart
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: helm-chart
          path: dist/
      - name: Create Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe  # v2.6.1
        with:
          generate_release_notes: true
          draft: false
          files: |
            dist/*.tgz
          body_suffix: |

            ## Container Images

            Images are available on GitHub Container Registry:

            ```bash
            # API
            docker pull ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}

            # Worker
            docker pull ghcr.io/${{ github.repository }}/worker:${{ github.ref_name }}

            # Beat scheduler
            docker pull ghcr.io/${{ github.repository }}/beat:${{ github.ref_name }}

            # Frontend
            docker pull ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}
            ```

            ## Helm Install

            ```bash
            helm repo add bitnami https://charts.bitnami.com/bitnami
            helm repo add minio https://charts.min.io/
            helm repo add gitea https://dl.gitea.io/charts/
            helm install audit-log ./audit-log-analyzer-*.tgz \
              --namespace audit-log --create-namespace \
              --set global.image.tag=${{ github.ref_name }}
            ```
