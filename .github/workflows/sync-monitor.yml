# Trigger and monitor GitHub enterprise sync from the management runner
name: Sync Monitor

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        type: choice
        options:
          - trigger-and-monitor
          - status-only
        default: trigger-and-monitor

jobs:
  sync:
    name: Sync Monitor
    runs-on: [self-hosted, k8s-mgmt]
    permissions:
      contents: read
    steps:
      - name: Get API pod
        id: pod
        run: |
          POD=$(kubectl get pods -n octowatch -l app.kubernetes.io/component=api -o jsonpath='{.items[0].metadata.name}')
          echo "pod=${POD}" >> "$GITHUB_OUTPUT"
          echo "API pod: ${POD}"

      - name: Check current sync status
        run: |
          kubectl exec -n octowatch ${{ steps.pod.outputs.pod }} -- \
            python -c "
          import asyncio, os
          import asyncpg

          async def main():
              db_url = os.environ['DATABASE_URL'].replace('+asyncpg', '').replace('postgresql+psycopg://', 'postgresql://')
              conn = await asyncpg.connect(db_url)

              # Latest 3 runs
              runs = await conn.fetch('SELECT id, status, started_at, completed_at, error_message FROM enterprise_sync_runs ORDER BY created_at DESC LIMIT 3')
              print('=== Recent Sync Runs ===')
              for r in runs:
                  print(f'  {r[\"id\"]} | status={r[\"status\"]} | started={r[\"started_at\"]} | completed={r[\"completed_at\"]} | error={r[\"error_message\"]}')

              if runs:
                  latest_id = runs[0]['id']
                  print(f'\n=== Latest Run Entity Status ({latest_id}) ===')
                  cursors = await conn.fetch('SELECT entity_type, org, status, items_synced FROM enterprise_sync_entity_cursors WHERE run_id = \$1 ORDER BY entity_type', latest_id)
                  failed = []
                  for c in cursors:
                      icon = '✓' if c['status'] == 'completed' else '✗' if c['status'] == 'failed' else '…'
                      org = c['org'] or 'enterprise'
                      print(f'  {icon} {c[\"entity_type\"]:30s} org={org:20s} items={c[\"items_synced\"] or 0:6d} status={c[\"status\"]}')
                      if c['status'] == 'failed':
                          failed.append(c)

                  print(f'\nSummary: {len(cursors)} entities, {len(failed)} failed')
                  if failed:
                      print('\n=== Failed Entities ===')
                      for f in failed:
                          logs = await conn.fetch('SELECT message FROM sync_log_entries WHERE run_id = \$1 AND entity_type = \$2 AND level = \$3 ORDER BY seq DESC LIMIT 2', latest_id, f['entity_type'], 'error')
                          for log in logs:
                              print(f'  [{f[\"entity_type\"]}:{f[\"org\"]}] {log[\"message\"]}')

              await conn.close()

          asyncio.run(main())
          "

      - name: Trigger new sync
        if: inputs.action == 'trigger-and-monitor'
        run: |
          kubectl exec -n octowatch ${{ steps.pod.outputs.pod }} -- \
            python -c "
          import asyncio, uuid, os
          from datetime import datetime, UTC
          import asyncpg
          from app.celery_app import celery_app

          async def main():
              db_url = os.environ['DATABASE_URL'].replace('+asyncpg', '').replace('postgresql+psycopg://', 'postgresql://')
              conn = await asyncpg.connect(db_url)
              run_id = str(uuid.uuid4())
              await conn.execute(
                  'INSERT INTO enterprise_sync_runs (id, status, trigger_type, created_at) VALUES (\$1, \$2, \$3, \$4)',
                  uuid.UUID(run_id), 'pending', 'manual', datetime.now(UTC)
              )
              await conn.close()
              print(f'Created sync run: {run_id}')

              celery_app.send_task(
                  'app.workers.github_sync.run_enterprise_sync',
                  kwargs={'run_id': run_id, 'scope': 'full'},
                  queue='github_sync',
              )
              print('Dispatched run_enterprise_sync task')

          asyncio.run(main())
          "

      - name: Wait and monitor (5 min intervals, 30 min max)
        if: inputs.action == 'trigger-and-monitor'
        run: |
          for i in $(seq 1 6); do
            echo "--- Check $i ($(date)) ---"
            sleep 300

            STATUS=$(kubectl exec -n octowatch ${{ steps.pod.outputs.pod }} -- \
              python -c "
          import asyncio, os
          import asyncpg

          async def main():
              db_url = os.environ['DATABASE_URL'].replace('+asyncpg', '').replace('postgresql+psycopg://', 'postgresql://')
              conn = await asyncpg.connect(db_url)
              row = await conn.fetchrow('SELECT id, status, error_message FROM enterprise_sync_runs ORDER BY created_at DESC LIMIT 1')
              if not row:
                  print('NO_RUNS')
                  await conn.close()
                  return
              print(f'STATUS={row[\"status\"]}')
              run_id = row['id']
              cursors = await conn.fetch('SELECT entity_type, org, status, items_synced FROM enterprise_sync_entity_cursors WHERE run_id = \$1', run_id)
              completed = sum(1 for c in cursors if c['status'] == 'completed')
              failed = sum(1 for c in cursors if c['status'] == 'failed')
              in_progress = sum(1 for c in cursors if c['status'] == 'in_progress')
              total_items = sum(c['items_synced'] or 0 for c in cursors)
              print(f'ENTITIES: {len(cursors)} total, {completed} done, {in_progress} running, {failed} failed')
              print(f'ITEMS: {total_items}')
              if failed:
                  for c in cursors:
                      if c['status'] == 'failed':
                          print(f'FAILED: {c[\"entity_type\"]} org={c[\"org\"]}')
              if row['error_message']:
                  print(f'ERROR: {row[\"error_message\"]}')
              await conn.close()

          asyncio.run(main())
          ")

            echo "$STATUS"

            if echo "$STATUS" | grep -q "STATUS=completed"; then
              echo "✅ Sync completed successfully!"
              exit 0
            elif echo "$STATUS" | grep -q "STATUS=failed"; then
              echo "❌ Sync failed!"
              exit 1
            fi
          done

          echo "⏱️ Sync still running after 30 minutes — check manually"
          exit 0
