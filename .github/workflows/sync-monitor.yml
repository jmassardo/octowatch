# Trigger and monitor GitHub enterprise sync from the management runner
name: Sync Monitor

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        type: choice
        options:
          - trigger-and-monitor
          - status-only
        default: trigger-and-monitor

jobs:
  sync:
    name: Sync Monitor
    runs-on: [self-hosted, k8s-mgmt]
    permissions:
      contents: read
    steps:
      - name: Get API pod
        id: pod
        run: |
          POD=$(kubectl get pods -n octowatch -l app.kubernetes.io/component=api -o jsonpath='{.items[0].metadata.name}')
          echo "pod=${POD}" >> "$GITHUB_OUTPUT"
          echo "API pod: ${POD}"

      - name: Check current sync status
        run: |
          kubectl exec -n octowatch ${{ steps.pod.outputs.pod }} -- \
            python -c "
          import os, psycopg2

          db_url = os.environ['DATABASE_URL'].replace('+asyncpg', '').replace('postgresql+psycopg', 'postgresql')
          if 'postgresql://' not in db_url:
              db_url = db_url.replace('postgres://', 'postgresql://')
          conn = psycopg2.connect(db_url)
          cur = conn.cursor()

          # Latest 3 runs
          cur.execute('SELECT id, status, started_at, completed_at, error_message FROM enterprise_sync_runs ORDER BY created_at DESC LIMIT 3')
          runs = cur.fetchall()
          print('=== Recent Sync Runs ===')
          for r in runs:
              print(f'  {r[0]} | status={r[1]} | started={r[2]} | completed={r[3]} | error={r[4]}')

          if runs:
              latest_id = runs[0][0]
              print(f'\n=== Latest Run Entity Status ({latest_id}) ===')
              cur.execute('''SELECT entity_type, org, status, items_synced
                  FROM enterprise_sync_entity_cursors
                  WHERE run_id = %s ORDER BY entity_type''', (latest_id,))
              cursors = cur.fetchall()
              failed = []
              for c in cursors:
                  icon = '✓' if c[2] == 'completed' else '✗' if c[2] == 'failed' else '…'
                  org = c[1] or 'enterprise'
                  print(f'  {icon} {c[0]:30s} org={org:20s} items={c[3] or 0:6d} status={c[2]}')
                  if c[2] == 'failed':
                      failed.append(c)

              print(f'\nSummary: {len(cursors)} entities, {len(failed)} failed')
              if failed:
                  print('\n=== Failed Entities ===')
                  for f in failed:
                      cur.execute('''SELECT message FROM sync_log_entries
                          WHERE run_id = %s AND entity_type = %s AND level = 'error'
                          ORDER BY seq DESC LIMIT 2''', (latest_id, f[0]))
                  for log in cur.fetchall():
                      print(f'  [{f[0]}:{f[1]}] {log[0]}')

          cur.close()
          conn.close()
          "

      - name: Trigger new sync
        if: inputs.action == 'trigger-and-monitor'
        run: |
          kubectl exec -n octowatch ${{ steps.pod.outputs.pod }} -- \
            python -c "
          import uuid, os
          from datetime import datetime, UTC
          from app.celery_app import celery_app
          import psycopg2

          # Create run record using sync psycopg2 (avoids async greenlet issues)
          db_url = os.environ['DATABASE_URL'].replace('+asyncpg', '').replace('postgresql+psycopg', 'postgresql')
          if 'postgresql://' not in db_url:
              db_url = db_url.replace('postgres://', 'postgresql://')
          conn = psycopg2.connect(db_url)
          cur = conn.cursor()
          run_id = str(uuid.uuid4())
          cur.execute(
              \"\"\"INSERT INTO enterprise_sync_runs (id, status, trigger_type, created_at)
                 VALUES (%s, 'pending', 'manual', %s)\"\"\",
              (run_id, datetime.now(UTC))
          )
          conn.commit()
          cur.close()
          conn.close()
          print(f'Created sync run: {run_id}')

          # Dispatch Celery task
          celery_app.send_task(
              'app.workers.github_sync.run_enterprise_sync',
              kwargs={'run_id': run_id, 'scope': 'full'},
              queue='github_sync',
          )
          print('Dispatched run_enterprise_sync task')
          "

      - name: Wait and monitor (5 min intervals, 30 min max)
        if: inputs.action == 'trigger-and-monitor'
        run: |
          for i in $(seq 1 6); do
            echo "--- Check $i ($(date)) ---"
            sleep 300

            STATUS=$(kubectl exec -n octowatch ${{ steps.pod.outputs.pod }} -- \
              python -c "
          import os, psycopg2

          db_url = os.environ['DATABASE_URL'].replace('+asyncpg', '').replace('postgresql+psycopg', 'postgresql')
          if 'postgresql://' not in db_url:
              db_url = db_url.replace('postgres://', 'postgresql://')
          conn = psycopg2.connect(db_url)
          cur = conn.cursor()

          cur.execute('SELECT id, status, error_message FROM enterprise_sync_runs ORDER BY created_at DESC LIMIT 1')
          row = cur.fetchone()
          if not row:
              print('NO_RUNS')
          else:
              run_id, status, error = row
              print(f'STATUS={status}')
              cur.execute('''SELECT entity_type, org, status, items_synced
                  FROM enterprise_sync_entity_cursors WHERE run_id = %s''', (run_id,))
              cursors = cur.fetchall()
              completed = sum(1 for c in cursors if c[2] == 'completed')
              failed = sum(1 for c in cursors if c[2] == 'failed')
              in_progress = sum(1 for c in cursors if c[2] == 'in_progress')
              total_items = sum(c[3] or 0 for c in cursors)
              print(f'ENTITIES: {len(cursors)} total, {completed} done, {in_progress} running, {failed} failed')
              print(f'ITEMS: {total_items}')
              if failed:
                  for c in cursors:
                      if c[2] == 'failed':
                          print(f'FAILED: {c[0]} org={c[1]}')
              if error:
                  print(f'ERROR: {error}')

          cur.close()
          conn.close()
          ")

            echo "$STATUS"

            if echo "$STATUS" | grep -q "STATUS=completed"; then
              echo "✅ Sync completed successfully!"
              exit 0
            elif echo "$STATUS" | grep -q "STATUS=failed"; then
              echo "❌ Sync failed!"
              exit 1
            fi
          done

          echo "⏱️ Sync still running after 30 minutes — check manually"
          exit 0
