# =============================================================================
# Publish & Deploy — Build Docker images, push to GHCR, deploy to K8s cluster
#
# Triggers:
#   1. Automatically after a successful CI run on main.
#   2. On version tags (v*).
#   3. Manually via workflow_dispatch.
#
# Images are published to ghcr.io/<owner>/octowatch-{api,worker,frontend,beat}
# tagged with both the commit SHA and "latest". Version tags also get the
# semver tag (e.g. v1.2.3).
#
# After publish, the deploy job runs on the self-hosted runner (mgmt VM) and
# performs a direct helm upgrade — no ArgoCD, no Azure credentials needed.
# =============================================================================
name: Publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  push:
    tags: ["v*"]

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to commit SHA)"
        required: false
        default: ""

concurrency:
  group: publish-images
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  publish:
    name: Build & Push (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            context: backend
            target: production
          - name: worker
            context: backend
            target: worker
          - name: beat
            context: backend
            target: beat
          - name: frontend
            context: frontend
            target: ""

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6.0.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/octowatch-${{ matrix.image.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event.inputs.image_tag != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Build & push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: ${{ matrix.image.context }}
          target: ${{ matrix.image.target || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish-${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.image.name }}

  deploy:
    name: Deploy to K8s
    runs-on: [self-hosted, k8s-mgmt]
    needs: [publish]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    concurrency:
      group: deploy-k8s
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Resolve image tag
        id: tag
        env:
          MANUAL_TAG: ${{ github.event.inputs.image_tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -n "${MANUAL_TAG}" ]; then
            echo "tag=${MANUAL_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${RUN_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Helm dependencies
        run: helm dependency build ./helm

      - name: Run Alembic migrations
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Running migrations with image tag: ${TAG}"
          kubectl run alembic-migrate \
            --image="${{ env.IMAGE_PREFIX }}/octowatch-api:${TAG}" \
            --restart=Never \
            --rm -i \
            --namespace=octowatch \
            --overrides='{
              "spec": {
                "imagePullSecrets": [{"name": "ghcr-pull-secret"}],
                "containers": [{
                  "name": "alembic-migrate",
                  "image": "'"${{ env.IMAGE_PREFIX }}/octowatch-api:${TAG}"'",
                  "command": ["python", "-m", "alembic", "upgrade", "head"],
                  "env": [
                    {"name": "DATABASE_URL", "valueFrom": {"secretKeyRef": {"name": "octowatch-secrets", "key": "database-url"}}},
                    {"name": "SECRET_KEY", "valueFrom": {"secretKeyRef": {"name": "octowatch-secrets", "key": "secret-key"}}}
                  ]
                }]
              }
            }'

      - name: Helm upgrade
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Deploying image tag: ${TAG}"
          helm upgrade --install octowatch ./helm \
            -f helm/values.yaml \
            -f helm/values-selfmanaged.yaml \
            --set global.image.tag="${TAG}" \
            --namespace octowatch \
            --timeout 5m \
            --wait

      - name: Verify rollout
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Verifying deployments..."

          kubectl rollout status deployment/octowatch-api -n octowatch --timeout=120s
          kubectl rollout status deployment/octowatch-frontend -n octowatch --timeout=60s

          # Verify correct image tag
          CURRENT=$(kubectl get deployment octowatch-api -n octowatch \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Current API image: ${CURRENT}"
          if ! echo "$CURRENT" | grep -q "${TAG}"; then
            echo "❌ Image tag mismatch! Expected ${TAG} in ${CURRENT}"
            exit 1
          fi

          # Health check
          kubectl exec -n octowatch deploy/octowatch-api -- \
            curl -sf http://localhost:8000/ready

          echo ""
          kubectl get pods -n octowatch
          echo "✅ Deploy complete — running ${TAG}"
