# =============================================================================
# Publish — Build Docker images and push to GitHub Container Registry (GHCR)
#
# Triggers:
#   1. Automatically after a successful CI run on main.
#   2. On version tags (v*).
#   3. Manually via workflow_dispatch.
#
# Images are published to ghcr.io/<owner>/octowatch-{api,worker,frontend}
# tagged with both the commit SHA and "latest".  Version tags also get the
# semver tag (e.g. v1.2.3).
# =============================================================================
name: Publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  push:
    tags: ["v*"]

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish (defaults to commit SHA)"
        required: false
        default: ""

concurrency:
  group: publish-images
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  publish:
    name: Build & Push (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            context: backend
            target: production
          - name: worker
            context: backend
            target: worker
          - name: beat
            context: backend
            target: beat
          - name: frontend
            context: frontend
            target: ""

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804  # v5.7.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/octowatch-${{ matrix.image.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event.inputs.image_tag != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Build & push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294  # v7.0.0
        with:
          context: ${{ matrix.image.context }}
          target: ${{ matrix.image.target || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish-${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.image.name }}

  # After all images are pushed, update the image tag in values-azure.yaml
  # so ArgoCD detects the change and triggers a rolling rollout automatically.
  update-helm-tag:
    name: Update Helm image tag
    runs-on: ubuntu-latest
    needs: [publish]
    # Only update the tag for main-branch pushes, not version tags
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image SHA tag
        id: tag
        run: |
          # workflow_run carries the SHA of the commit that triggered CI
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Write tag into values-azure.yaml
        run: |
          TAG="${{ steps.tag.outputs.sha }}"
          # Upsert global.image.tag — add it if absent, replace if present
          if grep -q "^  tag:" helm/values-azure.yaml; then
            sed -i "s/^  tag:.*$/  tag: \"${TAG}\"/" helm/values-azure.yaml
          else
            sed -i "/^global:/a\\  tag: \"${TAG}\"" helm/values-azure.yaml
          fi
          echo "Set global.image.tag: ${TAG}"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values-azure.yaml
          git diff --staged --quiet && echo "No tag change, skipping commit" && exit 0
          git commit -m "chore: update image tag to ${{ steps.tag.outputs.sha }} [skip ci]"
          git push
