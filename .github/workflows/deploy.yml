# =============================================================================
# Deploy — Ring-based deployment to Kubernetes
#
# Deploys OctoWatch to customer namespaces in 3 rings:
#   1. test    — internal instance, automatic after release
#   2. preview — early-access customers, manual gate after test passes
#   3. prod    — all production customers, manual gate after preview bakes
#
# Customer namespaces are discovered via Kubernetes labels:
#   octowatch.dev/ring=test|preview|prod
#   octowatch.dev/size=small|medium|large
#
# No customer-specific data is stored in this repository. All customer
# configuration lives in Kubernetes namespace labels and Azure Key Vault.
# =============================================================================
name: Deploy

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g., v1.2.3). Defaults to latest release tag."
        required: false
        default: ""
      ring:
        description: "Deploy to a specific ring only (empty = full rollout)"
        required: false
        type: choice
        options:
          - ""
          - test
          - preview
          - prod
      force_reinstall:
        description: "Uninstall existing releases before deploying (use for broken StatefulSet upgrades)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  FORCE_REINSTALL: ${{ github.event.inputs.force_reinstall || 'false' }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Ring 1: TEST (automatic)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-test:
    name: "Ring: test"
    runs-on: [self-hosted, k8s-mgmt]
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.ring == '' || github.event.inputs.ring == 'test')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      actions: read

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Clean stale worktrees
        run: |
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            cd "$GITHUB_WORKSPACE"
            git worktree prune 2>/dev/null || true
            rm -rf .worktrees 2>/dev/null || true
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve image tag
        id: tag
        env:
          MANUAL_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [ -n "${MANUAL_TAG:-}" ]; then
            echo "tag=${MANUAL_TAG}" >> "$GITHUB_OUTPUT"
            echo "Using manual tag: ${MANUAL_TAG}"
          else
            # Get the latest semver tag (created by the Release workflow)
            TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
            if [ -z "${TAG}" ]; then
              echo "::error::No release tag found. Run the Release workflow first."
              exit 1
            fi
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "Deploying latest release: ${TAG}"
          fi

      - name: Build Helm dependencies
        run: helm dependency build ./helm

      - name: Ensure namespace labels
        run: |
          # The internal 'octowatch' namespace is our test ring instance
          kubectl label ns octowatch octowatch.dev/ring=test --overwrite 2>/dev/null || true
          kubectl label ns octowatch octowatch.dev/customer=csa --overwrite 2>/dev/null || true
          kubectl label ns octowatch octowatch.dev/size=small --overwrite 2>/dev/null || true

      - name: Discover test namespaces
        id: discover
        run: |
          NAMESPACES=$(kubectl get ns -l octowatch.dev/ring=test -o jsonpath='{.items[*].metadata.name}')
          if [ -z "$NAMESPACES" ]; then
            echo "::warning::No test ring namespaces found. Skipping."
            echo "namespaces=" >> "$GITHUB_OUTPUT"
          else
            echo "namespaces=${NAMESPACES}" >> "$GITHUB_OUTPUT"
            echo "Found test namespaces: ${NAMESPACES}"
          fi

      - name: Deploy to test ring
        if: steps.discover.outputs.namespaces != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          for NS in ${{ steps.discover.outputs.namespaces }}; do
            ./scripts/deploy-namespace.sh "${NS}" "${TAG}" "./helm"
          done

      - name: Verify test deployments
        if: steps.discover.outputs.namespaces != ''
        run: |
          for NS in ${{ steps.discover.outputs.namespaces }}; do
            echo "Verifying ${NS}..."
            kubectl rollout status deployment/${NS}-api -n "${NS}" --timeout=120s
            kubectl rollout status deployment/${NS}-frontend -n "${NS}" --timeout=60s

            # Health check via cluster DNS
            kubectl run smoke-test-${NS} \
              --image=curlimages/curl:8.7.1 \
              --restart=Never --rm -i \
              --namespace="${NS}" \
              --command -- curl -sf "http://${NS}-api:8000/health" || {
                echo "✗ Health check failed for ${NS}"
                exit 1
              }
            echo "✓ ${NS} healthy"
          done

  # ═══════════════════════════════════════════════════════════════════════════
  # Ring 2: PREVIEW (manual gate)
  # ═══════════════════════════════════════════════════════════════════════════
  gate-preview:
    name: "Gate: approve preview"
    runs-on: ubuntu-latest
    needs: [deploy-test]
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.ring == '') ||
      (github.event_name == 'workflow_run')
    permissions: {}
    environment: preview

    steps:
      - run: echo "Preview deployment approved"

  deploy-preview:
    name: "Ring: preview"
    runs-on: [self-hosted, k8s-mgmt]
    needs: [gate-preview, deploy-test]
    permissions:
      contents: read

    steps:
      - name: Clean stale worktrees
        run: |
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            cd "$GITHUB_WORKSPACE"
            git worktree prune 2>/dev/null || true
            rm -rf .worktrees 2>/dev/null || true
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Build Helm dependencies
        run: helm dependency build ./helm

      - name: Discover preview namespaces
        id: discover
        run: |
          NAMESPACES=$(kubectl get ns -l octowatch.dev/ring=preview -o jsonpath='{.items[*].metadata.name}')
          if [ -z "$NAMESPACES" ]; then
            echo "::warning::No preview ring namespaces found. Skipping."
            echo "namespaces=" >> "$GITHUB_OUTPUT"
          else
            echo "namespaces=${NAMESPACES}" >> "$GITHUB_OUTPUT"
            echo "Found preview namespaces: ${NAMESPACES}"
          fi

      - name: Deploy to preview ring
        if: steps.discover.outputs.namespaces != ''
        env:
          TAG: ${{ needs.deploy-test.outputs.image_tag }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          for NS in ${{ steps.discover.outputs.namespaces }}; do
            ./scripts/deploy-namespace.sh "${NS}" "${TAG}" "./helm"
          done

      - name: Verify preview deployments
        if: steps.discover.outputs.namespaces != ''
        run: |
          for NS in ${{ steps.discover.outputs.namespaces }}; do
            kubectl rollout status deployment/${NS}-api -n "${NS}" --timeout=120s
            echo "✓ ${NS} healthy"
          done

  # ═══════════════════════════════════════════════════════════════════════════
  # Ring 3: PROD (manual gate)
  # ═══════════════════════════════════════════════════════════════════════════
  gate-prod:
    name: "Gate: approve prod"
    runs-on: ubuntu-latest
    needs: [deploy-preview]
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.ring == '') ||
      (github.event_name == 'workflow_run')
    permissions: {}
    environment: production

    steps:
      - run: echo "Production deployment approved"

  deploy-prod:
    name: "Ring: prod"
    runs-on: [self-hosted, k8s-mgmt]
    needs: [gate-prod, deploy-test]
    permissions:
      contents: read

    steps:
      - name: Clean stale worktrees
        run: |
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            cd "$GITHUB_WORKSPACE"
            git worktree prune 2>/dev/null || true
            rm -rf .worktrees 2>/dev/null || true
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Build Helm dependencies
        run: helm dependency build ./helm

      - name: Discover prod namespaces
        id: discover
        run: |
          NAMESPACES=$(kubectl get ns -l octowatch.dev/ring=prod -o jsonpath='{.items[*].metadata.name}')
          if [ -z "$NAMESPACES" ]; then
            echo "::warning::No prod ring namespaces found. Skipping."
            echo "namespaces=" >> "$GITHUB_OUTPUT"
          else
            echo "namespaces=${NAMESPACES}" >> "$GITHUB_OUTPUT"
            echo "Found prod namespaces: ${NAMESPACES}"
          fi

      - name: Deploy to prod ring
        if: steps.discover.outputs.namespaces != ''
        env:
          TAG: ${{ needs.deploy-test.outputs.image_tag }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          for NS in ${{ steps.discover.outputs.namespaces }}; do
            ./scripts/deploy-namespace.sh "${NS}" "${TAG}" "./helm"
          done

      - name: Verify prod deployments
        if: steps.discover.outputs.namespaces != ''
        run: |
          FAILED=""
          for NS in ${{ steps.discover.outputs.namespaces }}; do
            if kubectl rollout status deployment/${NS}-api -n "${NS}" --timeout=120s; then
              echo "✓ ${NS} healthy"
            else
              echo "✗ ${NS} FAILED"
              FAILED="${FAILED} ${NS}"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Deployments failed:${FAILED}"
            exit 1
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # Direct ring deploy (workflow_dispatch with specific ring)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-single-ring:
    name: "Deploy: ${{ github.event.inputs.ring }} only"
    runs-on: [self-hosted, k8s-mgmt]
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.ring != '' && github.event.inputs.ring != 'test'
    permissions:
      contents: read

    steps:
      - name: Clean stale worktrees
        run: |
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            cd "$GITHUB_WORKSPACE"
            git worktree prune 2>/dev/null || true
            rm -rf .worktrees 2>/dev/null || true
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve image tag
        id: tag
        env:
          MANUAL_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [ -n "${MANUAL_TAG:-}" ]; then
            echo "tag=${MANUAL_TAG}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
            if [ -z "${TAG}" ]; then
              echo "::error::No release tag found."
              exit 1
            fi
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Helm dependencies
        run: helm dependency build ./helm

      - name: Discover namespaces
        id: discover
        run: |
          RING="${{ github.event.inputs.ring }}"
          NAMESPACES=$(kubectl get ns -l "octowatch.dev/ring=${RING}" -o jsonpath='{.items[*].metadata.name}')
          if [ -z "$NAMESPACES" ]; then
            echo "::warning::No namespaces found for ring=${RING}"
            echo "namespaces=" >> "$GITHUB_OUTPUT"
          else
            echo "namespaces=${NAMESPACES}" >> "$GITHUB_OUTPUT"
            echo "Found ${RING} namespaces: ${NAMESPACES}"
          fi

      - name: Deploy to ring
        if: steps.discover.outputs.namespaces != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          for NS in ${{ steps.discover.outputs.namespaces }}; do
            ./scripts/deploy-namespace.sh "${NS}" "${TAG}" "./helm"
          done
