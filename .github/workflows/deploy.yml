# =============================================================================
# Publish — Build Docker images and push to GitHub Container Registry (GHCR)
#
# Triggers:
#   1. Automatically after a successful CI run on main.
#   2. On version tags (v*).
#   3. Manually via workflow_dispatch.
#
# Images are published to ghcr.io/<owner>/octowatch-{api,worker,frontend}
# tagged with both the commit SHA and "latest".  Version tags also get the
# semver tag (e.g. v1.2.3).
# =============================================================================
name: Publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  push:
    tags: ["v*"]

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish (defaults to commit SHA)"
        required: false
        default: ""

concurrency:
  group: publish-images
  cancel-in-progress: true

# Serialized concurrency for the helm-tag update (applied at job level below)

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  publish:
    name: Build & Push (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            context: backend
            target: production
          - name: worker
            context: backend
            target: worker
          - name: beat
            context: backend
            target: beat
          - name: frontend
            context: frontend
            target: ""

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2  # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6.0.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/octowatch-${{ matrix.image.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event.inputs.image_tag != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Build & push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: ${{ matrix.image.context }}
          target: ${{ matrix.image.target || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish-${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.image.name }}

  # After all images are pushed, update the image tag in values-image-tag.yaml
  # so ArgoCD detects the change and triggers a rolling rollout automatically.
  update-helm-tag:
    name: Update Helm image tag
    runs-on: ubuntu-latest
    needs: [publish]
    # Only update the tag for main-branch pushes, not version tags
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    concurrency:
      group: update-helm-tag
      cancel-in-progress: false
    outputs:
      tag-updated: ${{ steps.push.outputs.tag-updated }}
      image-tag: ${{ steps.tag.outputs.sha }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image SHA tag
        id: tag
        run: |
          # Use manual input if provided, otherwise derive from commit SHA
          MANUAL_TAG="${{ github.event.inputs.image_tag }}"
          if [ -n "${MANUAL_TAG}" ]; then
            echo "sha=${MANUAL_TAG}" >> "$GITHUB_OUTPUT"
          else
            # workflow_run carries the SHA of the commit that triggered CI
            SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
            echo "sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch latest main and write tag
        run: |
          TAG="${{ steps.tag.outputs.sha }}"
          # Fetch and reset to latest main to avoid overwriting a newer tag
          git fetch origin main
          git reset --hard origin/main
          # Replace the tag line in the dedicated image-tag values file
          sed -i "s|tag:.*|tag: \"${TAG}\"|" helm/values-image-tag.yaml
          echo "Set global.image.tag: ${TAG}"

      - name: Commit and push
        id: push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values-image-tag.yaml
          if git diff --staged --quiet; then
            echo "No tag change, skipping commit"
            echo "tag-updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update image tag to ${{ steps.tag.outputs.sha }} [skip ci]"
          if git push; then
            echo "tag-updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "Push rejected — newer tag already committed, skipping"
            echo "tag-updated=false" >> "$GITHUB_OUTPUT"
          fi

  # Verify the deployment was picked up by ArgoCD and pods are running the new tag.
  verify-deploy:
    name: Verify AKS deployment
    runs-on: ubuntu-latest
    needs: [update-helm-tag]
    if: needs.update-helm-tag.outputs.tag-updated == 'true'

    steps:
      - name: Azure login
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302  # v2.2.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group rg-octowatch-dev \
            --name aks-octowatch-dev \
            --overwrite-existing

      - name: Wait for rollout
        env:
          EXPECTED_TAG: ${{ needs.update-helm-tag.outputs.image-tag }}
        run: |
          echo "Waiting for AKS pods to run image tag: ${EXPECTED_TAG}"
          for i in $(seq 1 30); do
            CURRENT=$(kubectl get deployment octowatch-api -n octowatch \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "unknown")
            echo "[${i}/30] Current image: ${CURRENT}"
            if echo "$CURRENT" | grep -q "${EXPECTED_TAG}"; then
              echo "✅ Image tag matches!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ Timed out waiting for image tag ${EXPECTED_TAG}"
              exit 1
            fi
            sleep 10
          done

          # Verify all pods are ready
          kubectl rollout status deployment/octowatch-api -n octowatch --timeout=120s
          kubectl rollout status deployment/octowatch-frontend -n octowatch --timeout=60s

          # Show final pod status
          kubectl get pods -n octowatch -o wide

          echo "✅ Deployment verified on AKS"
