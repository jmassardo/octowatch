# =============================================================================
# Deploy — Roll out new OctoWatch images to Azure
#
# Triggers:
#   1. Automatically after a successful Publish workflow (every main push).
#   2. Automatically after a successful Release workflow (v* tags).
#   3. Manually via workflow_dispatch with an optional image tag.
#
# Jobs:
#   deploy     — SSH-based Docker Compose rolling restart on the Azure VM.
#                Active during the migration window while the VM is live.
#   deploy-aca — Azure Container Apps image update (az containerapp update).
#                Active only when the ACA_ENABLED repository secret is set.
#                Set ACA_ENABLED=true once the ACA environment is provisioned
#                and smoke-tested. Both jobs can run in parallel during the
#                parallel-run migration window.
#
# NOTE: Terraform is intentionally NOT run here for image-only releases.
# Changing custom_data in Terraform forces full VM replacement — application
# updates are handled by in-place docker compose rolling restarts instead.
# Run `terraform apply` manually for infrastructure changes only.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   AZURE_VM_SSH_KEY  — contents of ~/.ssh/id_ed25519 (private key)
#   AZURE_VM_HOST     — octowatch.jmassardo.azure.csa-github.com
#   AZURE_VM_USER     — octowatch
#
# ACA-specific secrets (only needed when ACA_ENABLED = true):
#   ACA_ENABLED           — set to any non-empty value to activate ACA deploy
#   AZURE_CREDENTIALS     — JSON service principal credentials for `az login`.
#                           Obtain from a subscription Owner:
#                             az ad sp create-for-rbac \
#                               --name "octowatch-github-actions" \
#                               --role Contributor \
#                               --scopes /subscriptions/<sub-id>/resourceGroups/rg-octowatch-<env> \
#                               --sdk-auth
#                           Requires Microsoft.Authorization/roleAssignments/write on the RG.
#   ACA_RESOURCE_GROUP    — e.g. rg-octowatch-prod
#   ACA_ENVIRONMENT_NAME  — e.g. cae-octowatch-prod
#   ACA_FRONTEND_URL      — e.g. https://octowatch.example.com (for smoke test)
# =============================================================================
name: Deploy to Azure

on:
  workflow_run:
    workflows: ["Publish", "Release"]
    types: [completed]

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. v1.2.3 or latest)"
        required: false
        default: "latest"

# Only one deploy runs at a time; never cancel an in-flight deploy.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event.workflow_run.head_branch || inputs.image_tag || 'latest' }}
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # ── Determine image tag ────────────────────────────────────────────────
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.image_tag }}"
            TAG="${TAG:-latest}"
          else
            # Triggered by Publish or Release workflow
            REF="${{ github.event.workflow_run.head_branch }}"
            if [[ "$REF" =~ ^v[0-9] ]]; then
              TAG="$REF"
            else
              TAG="latest"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: $TAG"

      # ── Write SSH key ──────────────────────────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.AZURE_VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # ── Deploy ────────────────────────────────────────────────────────────
      - name: Pull images and restart containers
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "$VM_USER@$VM_HOST" \
            "bash -s" <<SSHEOF
          set -eu
          COMPOSE_FILE="/opt/octowatch/compose/docker-compose.yml"
          IMAGE_TAG="$IMAGE_TAG"
          GHCR_OWNER="$GHCR_OWNER"

          echo "==> Deploying OctoWatch \$IMAGE_TAG to \$(hostname)"

          # Update image tags in docker-compose.yml
          echo "==> Updating image tags to \$IMAGE_TAG..."
          sudo sed -i "s|/octowatch-api:[^[:space:]]*|/octowatch-api:\${IMAGE_TAG}|g"      "\$COMPOSE_FILE"
          sudo sed -i "s|/octowatch-worker:[^[:space:]]*|/octowatch-worker:\${IMAGE_TAG}|g" "\$COMPOSE_FILE"
          sudo sed -i "s|/octowatch-beat:[^[:space:]]*|/octowatch-beat:\${IMAGE_TAG}|g"     "\$COMPOSE_FILE"
          sudo sed -i "s|/octowatch-frontend:[^[:space:]]*|/octowatch-frontend:\${IMAGE_TAG}|g" "\$COMPOSE_FILE"

          # Pull the new images
          echo "==> Pulling new images..."
          cd /opt/octowatch/compose
          sudo docker compose pull api worker-ingestion worker-detection worker-notification worker-baseline worker-sync beat frontend 2>&1

          # Snapshot running container IDs for rollback
          OLD_API_IMAGE=\$(sudo docker inspect --format='{{.Image}}' \$(sudo docker compose ps -q api 2>/dev/null | head -1) 2>/dev/null || echo "")

          # Rolling restart: update services one group at a time
          echo "==> Restarting services..."
          sudo docker compose up -d --no-deps api beat
          sleep 10
          sudo docker compose up -d --no-deps worker-ingestion worker-detection worker-notification worker-baseline worker-sync
          sleep 5
          sudo docker compose up -d --no-deps frontend
          # Restart nginx last so it re-resolves all upstream IPs after container restarts.
          # nginx resolves upstream{} hostnames once at startup; restarting ensures it
          # picks up the new IPs assigned by Docker after the rolling container recreates.
          sudo docker compose restart nginx

          echo "==> Deployment complete."
          SSHEOF

      # ── Health check ─────────────────────────────────────────────────────
      - name: Health check
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          echo "Waiting 30s for containers to stabilise..."
          sleep 30

          # Check all containers are running (no unhealthy/exited)
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            "$VM_USER@$VM_HOST" \
            "bash -s" <<'SSHEOF'
          set -eu
          cd /opt/octowatch/compose
          echo "==> Container status:"
          sudo docker compose ps

          # Fail if any app container is not running/healthy
          UNHEALTHY=$(sudo docker compose ps --format json 2>/dev/null \
            | python3 -c "
          import sys, json
          data = sys.stdin.read().strip()
          if not data:
              sys.exit(0)
          services = []
          for line in data.splitlines():
              try:
                  services.append(json.loads(line))
              except:
                  pass
          bad = [s['Service'] for s in services
                 if s.get('Service') in ['api','worker-ingestion','worker-detection','worker-notification','worker-baseline','worker-sync','beat','frontend']
                 and 'running' not in s.get('State','').lower()
                 and 'healthy' not in s.get('Health','').lower()
                 and s.get('State','') != '']
          if bad:
              print('UNHEALTHY: ' + ', '.join(bad))
              sys.exit(1)
          " 2>/dev/null || echo "")

          if [ -n "$UNHEALTHY" ]; then
            echo "ERROR: $UNHEALTHY"
            exit 1
          fi
          echo "==> All containers healthy."
          SSHEOF

      # ── HTTPS smoke test ──────────────────────────────────────────────────
      - name: HTTPS smoke test
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
        run: |
          echo "Testing https://$VM_HOST/ ..."
          HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" "https://$VM_HOST/" || echo "000")
          echo "HTTP response: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "302" ]; then
            echo "ERROR: Expected 200/302, got $HTTP_CODE"
            exit 1
          fi
          echo "HTTPS smoke test passed."

      # ── Cleanup ───────────────────────────────────────────────────────────
      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ============================================================================
  # ACA Deploy — Update Container Apps images
  #
  # This job is active only when the ACA_ENABLED repository secret is set.
  # It runs in parallel with the VM deploy during the migration window,
  # then becomes the sole deploy job after the VM is decommissioned.
  #
  # Prerequisites:
  #   1. terraform apply has been run and the ACA environment is live
  #   2. AZURE_CREDENTIALS, ACA_RESOURCE_GROUP, ACA_ENVIRONMENT_NAME,
  #      and ACA_FRONTEND_URL secrets are configured in repository settings
  #   3. Set repository secret ACA_ENABLED to any non-empty value
  # ============================================================================
  deploy-aca:
    name: Deploy ACA ${{ github.event.workflow_run.head_branch || inputs.image_tag || 'latest' }}
    runs-on: ubuntu-latest
    if: >-
      secrets.ACA_ENABLED != '' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')

    steps:
      # ── Determine image tag ────────────────────────────────────────────────
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.image_tag }}"
            TAG="${TAG:-latest}"
          else
            REF="${{ github.event.workflow_run.head_branch }}"
            if [[ "$REF" =~ ^v[0-9] ]]; then
              TAG="$REF"
            else
              TAG="latest"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying ACA image tag: $TAG"

      # ── Azure login ────────────────────────────────────────────────────────
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── Update Container App images ────────────────────────────────────────
      - name: Update Container App images
        env:
          RG: ${{ secrets.ACA_RESOURCE_GROUP }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          API_IMAGE="ghcr.io/${GHCR_OWNER}/octowatch/api:${IMAGE_TAG}"
          WORKER_IMAGE="ghcr.io/${GHCR_OWNER}/octowatch/worker:${IMAGE_TAG}"
          FRONTEND_IMAGE="ghcr.io/${GHCR_OWNER}/octowatch/frontend:${IMAGE_TAG}"

          echo "==> Updating api → ${API_IMAGE}"
          az containerapp update \
            --name api \
            --resource-group "$RG" \
            --image "$API_IMAGE" \
            --output none

          echo "==> Updating frontend → ${FRONTEND_IMAGE}"
          az containerapp update \
            --name frontend \
            --resource-group "$RG" \
            --image "$FRONTEND_IMAGE" \
            --output none

          echo "==> Updating beat → ${WORKER_IMAGE}"
          az containerapp update \
            --name beat \
            --resource-group "$RG" \
            --image "$WORKER_IMAGE" \
            --output none

          for WORKER in worker-ingestion worker-detection worker-notification worker-baseline worker-sync; do
            echo "==> Updating ${WORKER} → ${WORKER_IMAGE}"
            az containerapp update \
              --name "$WORKER" \
              --resource-group "$RG" \
              --image "$WORKER_IMAGE" \
              --output none
          done

          echo "==> All Container App images updated."

      # ── Run database migrations ────────────────────────────────────────────
      # Alembic migrations are idempotent (upgrade head is a no-op if current).
      # Always run to ensure schema is up-to-date after every deploy.
      - name: Run database migrations
        env:
          RG: ${{ secrets.ACA_RESOURCE_GROUP }}
        run: |
          set -eu
          JOB_NAME=$(az containerapp job list \
            --resource-group "$RG" \
            --query "[?starts_with(name, 'job-migrate-')].name | [0]" \
            --output tsv)

          if [ -z "$JOB_NAME" ]; then
            echo "WARNING: migrate job not found in $RG — skipping migration."
            exit 0
          fi

          echo "==> Starting migration job: ${JOB_NAME}"
          EXECUTION=$(az containerapp job start \
            --name "$JOB_NAME" \
            --resource-group "$RG" \
            --query "name" \
            --output tsv)

          echo "==> Waiting for migration execution: ${EXECUTION}"
          # Poll until the job execution is no longer Running
          for i in $(seq 1 30); do
            STATUS=$(az containerapp job execution show \
              --name "$JOB_NAME" \
              --resource-group "$RG" \
              --job-execution-name "$EXECUTION" \
              --query "properties.status" \
              --output tsv 2>/dev/null || echo "Unknown")

            echo "  [${i}/30] Migration status: ${STATUS}"

            if [ "$STATUS" = "Succeeded" ]; then
              echo "==> Migration completed successfully."
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Stopped" ]; then
              echo "ERROR: Migration job failed with status: ${STATUS}"
              exit 1
            fi

            sleep 10
          done

          if [ "$STATUS" != "Succeeded" ]; then
            echo "ERROR: Migration job timed out after 5 minutes."
            exit 1
          fi

      # ── Health check ─────────────────────────────────────────────────────
      - name: ACA health check
        env:
          FRONTEND_URL: ${{ secrets.ACA_FRONTEND_URL }}
        run: |
          if [ -z "$FRONTEND_URL" ]; then
            echo "ACA_FRONTEND_URL not set — skipping smoke test."
            exit 0
          fi

          echo "Waiting 30s for Container Apps to stabilise..."
          sleep 30

          echo "Testing ${FRONTEND_URL} ..."
          HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" "${FRONTEND_URL}/" || echo "000")
          echo "HTTP response: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "302" ]; then
            echo "ERROR: Expected 200/302, got $HTTP_CODE"
            exit 1
          fi
          echo "ACA smoke test passed."

      # ── Azure logout ───────────────────────────────────────────────────────
      - name: Azure logout
        if: always()
        run: az logout || true

