# =============================================================================
# One-time fix: Transfer table ownership so Alembic migrations can run.
#
# Problem: Migration 0056+ fails with "must be owner of table threat_intel_feeds"
# because some tables are owned by 'postgres' instead of the app user.
#
# This workflow:
#   1. Connects to TimescaleDB as superuser (via kubectl exec into the DB pod)
#   2. Transfers ALL public schema objects to the app user
#   3. Runs pending Alembic migrations (0056-0059)
#   4. Verifies final migration state
#
# Delete this workflow after successful execution.
# =============================================================================
name: Fix DB Ownership

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — only report ownership issues, don't fix"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: deploy-k8s
  cancel-in-progress: false

jobs:
  fix-ownership:
    name: Fix Table Ownership & Run Migrations
    runs-on: [self-hosted, k8s-mgmt]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Identify DB pod and app user
        id: db-info
        run: |
          echo "=== Finding TimescaleDB pod ==="
          DB_POD=$(kubectl get pods -n octowatch -l app=timescaledb -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if [ -z "$DB_POD" ]; then
            # Try alternative labels
            DB_POD=$(kubectl get pods -n octowatch -l app.kubernetes.io/name=timescaledb -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          fi
          if [ -z "$DB_POD" ]; then
            # Search for any postgres/timescale pod
            DB_POD=$(kubectl get pods -n octowatch --no-headers | grep -i 'timescale\|postgres' | awk '{print $1}' | head -1)
          fi
          if [ -z "$DB_POD" ]; then
            echo "❌ Could not find TimescaleDB pod!"
            kubectl get pods -n octowatch
            exit 1
          fi
          echo "DB_POD=${DB_POD}"
          echo "db_pod=${DB_POD}" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=== Extracting app username from DATABASE_URL ==="
          DB_URL=$(kubectl get secret -n octowatch octowatch-secrets -o jsonpath='{.data.database-url}' | base64 -d)
          # Extract username from postgresql+asyncpg://USER:PASS@HOST/DB
          APP_USER=$(echo "$DB_URL" | sed -E 's|.*://([^:]+):.*|\1|')
          echo "APP_USER=${APP_USER}"
          echo "app_user=${APP_USER}" >> "$GITHUB_OUTPUT"

          # Extract DB name
          DB_NAME=$(echo "$DB_URL" | sed -E 's|.*/([^?]+).*|\1|')
          echo "DB_NAME=${DB_NAME}"
          echo "db_name=${DB_NAME}" >> "$GITHUB_OUTPUT"

      - name: Audit current ownership
        env:
          DB_POD: ${{ steps.db-info.outputs.db_pod }}
          APP_USER: ${{ steps.db-info.outputs.app_user }}
          DB_NAME: ${{ steps.db-info.outputs.db_name }}
        run: |
          echo "=== Tables NOT owned by ${APP_USER} ==="
          kubectl exec -n octowatch "${DB_POD}" -- psql -U postgres -d "${DB_NAME}" -c \
            "SELECT tablename, tableowner FROM pg_tables WHERE schemaname = 'public' AND tableowner != '${APP_USER}' ORDER BY tablename;"

          echo ""
          echo "=== Sequences NOT owned by ${APP_USER} ==="
          kubectl exec -n octowatch "${DB_POD}" -- psql -U postgres -d "${DB_NAME}" -c \
            "SELECT sequence_name, sequence_schema FROM information_schema.sequences WHERE sequence_schema = 'public';" \
            2>/dev/null || echo "(no sequences or query failed)"

          echo ""
          echo "=== Schema owner ==="
          kubectl exec -n octowatch "${DB_POD}" -- psql -U postgres -d "${DB_NAME}" -c \
            "SELECT nspname, pg_get_userbyid(nspowner) as owner FROM pg_namespace WHERE nspname = 'public';"

          echo ""
          echo "=== threat_intel_feeds table owner specifically ==="
          kubectl exec -n octowatch "${DB_POD}" -- psql -U postgres -d "${DB_NAME}" -c \
            "SELECT tablename, tableowner FROM pg_tables WHERE tablename = 'threat_intel_feeds';"

      - name: Fix ownership
        if: inputs.dry_run == 'false'
        env:
          DB_POD: ${{ steps.db-info.outputs.db_pod }}
          APP_USER: ${{ steps.db-info.outputs.app_user }}
          DB_NAME: ${{ steps.db-info.outputs.db_name }}
        run: |
          echo "=== Transferring ALL table ownership to ${APP_USER} ==="
          kubectl exec -n octowatch "${DB_POD}" -- psql -U postgres -d "${DB_NAME}" -c "
            DO \$\$
            DECLARE
              r RECORD;
              cnt INTEGER := 0;
            BEGIN
              FOR r IN SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND tableowner != '${APP_USER}'
              LOOP
                EXECUTE format('ALTER TABLE public.%I OWNER TO ${APP_USER}', r.tablename);
                RAISE NOTICE 'Changed owner of table: %', r.tablename;
                cnt := cnt + 1;
              END LOOP;
              RAISE NOTICE 'Total tables transferred: %', cnt;
            END \$\$;
          "

          echo ""
          echo "=== Transferring sequence ownership to ${APP_USER} ==="
          kubectl exec -n octowatch "${DB_POD}" -- psql -U postgres -d "${DB_NAME}" -c "
            DO \$\$
            DECLARE
              r RECORD;
              cnt INTEGER := 0;
            BEGIN
              FOR r IN SELECT sequence_name FROM information_schema.sequences WHERE sequence_schema = 'public'
              LOOP
                EXECUTE format('ALTER SEQUENCE public.%I OWNER TO ${APP_USER}', r.sequence_name);
                cnt := cnt + 1;
              END LOOP;
              RAISE NOTICE 'Sequences transferred: %', cnt;
            END \$\$;
          "

          echo ""
          echo "=== Transferring views ownership to ${APP_USER} ==="
          kubectl exec -n octowatch "${DB_POD}" -- psql -U postgres -d "${DB_NAME}" -c "
            DO \$\$
            DECLARE
              r RECORD;
            BEGIN
              FOR r IN SELECT viewname FROM pg_views WHERE schemaname = 'public' AND viewowner != '${APP_USER}'
              LOOP
                EXECUTE format('ALTER VIEW public.%I OWNER TO ${APP_USER}', r.viewname);
              END LOOP;
            END \$\$;
          "

          echo ""
          echo "=== Transferring schema ownership ==="
          kubectl exec -n octowatch "${DB_POD}" -- psql -U postgres -d "${DB_NAME}" -c \
            "ALTER SCHEMA public OWNER TO ${APP_USER};"

          echo ""
          echo "=== Granting default privileges for future objects ==="
          kubectl exec -n octowatch "${DB_POD}" -- psql -U postgres -d "${DB_NAME}" -c "
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO ${APP_USER};
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO ${APP_USER};
            GRANT ALL ON SCHEMA public TO ${APP_USER};
          "

      - name: Verify ownership fix
        if: inputs.dry_run == 'false'
        env:
          DB_POD: ${{ steps.db-info.outputs.db_pod }}
          APP_USER: ${{ steps.db-info.outputs.app_user }}
          DB_NAME: ${{ steps.db-info.outputs.db_name }}
        run: |
          echo "=== Verifying: tables NOT owned by ${APP_USER} (should be 0) ==="
          REMAINING=$(kubectl exec -n octowatch "${DB_POD}" -- psql -U postgres -d "${DB_NAME}" -t -c \
            "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND tableowner != '${APP_USER}';")
          REMAINING=$(echo "$REMAINING" | tr -d ' ')
          echo "Tables with wrong ownership: ${REMAINING}"

          if [ "$REMAINING" != "0" ]; then
            echo "⚠️  Some tables still have wrong ownership:"
            kubectl exec -n octowatch "${DB_POD}" -- psql -U postgres -d "${DB_NAME}" -c \
              "SELECT tablename, tableowner FROM pg_tables WHERE schemaname = 'public' AND tableowner != '${APP_USER}';"
            echo "Continuing anyway — these may be system tables..."
          else
            echo "✅ All tables owned by ${APP_USER}"
          fi

      - name: Run Alembic migrations
        if: inputs.dry_run == 'false'
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
        run: |
          echo "=== Running pending Alembic migrations ==="
          # Use the currently deployed image
          CURRENT_IMAGE=$(kubectl get deployment octowatch-api -n octowatch \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Using image: ${CURRENT_IMAGE}"

          kubectl run alembic-migrate-fix \
            --image="${CURRENT_IMAGE}" \
            --restart=Never \
            --rm -i \
            --namespace=octowatch \
            --overrides='{
              "spec": {
                "imagePullSecrets": [{"name": "ghcr-pull-secret"}],
                "containers": [{
                  "name": "alembic-migrate-fix",
                  "image": "'"${CURRENT_IMAGE}"'",
                  "command": ["python", "-m", "alembic", "upgrade", "head"],
                  "env": [
                    {"name": "DATABASE_URL", "valueFrom": {"secretKeyRef": {"name": "octowatch-secrets", "key": "database-url"}}},
                    {"name": "SECRET_KEY", "valueFrom": {"secretKeyRef": {"name": "octowatch-secrets", "key": "secret-key"}}}
                  ]
                }]
              }
            }'

      - name: Verify migration state
        if: inputs.dry_run == 'false'
        run: |
          echo "=== Current Alembic revision ==="
          kubectl exec -n octowatch deploy/octowatch-api -- python -m alembic current 2>/dev/null || \
            echo "Could not check via existing pod — checking alembic_version table directly"

          DB_POD="${{ steps.db-info.outputs.db_pod }}"
          DB_NAME="${{ steps.db-info.outputs.db_name }}"
          kubectl exec -n octowatch "${DB_POD}" -- psql -U postgres -d "${DB_NAME}" -c \
            "SELECT * FROM alembic_version;"

          echo ""
          echo "=== Checking for new tables from migrations 0057-0059 ==="
          kubectl exec -n octowatch "${DB_POD}" -- psql -U postgres -d "${DB_NAME}" -c \
            "SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename;" | tail -20

      - name: Summary
        if: always()
        run: |
          echo "============================================"
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            echo "DRY RUN COMPLETE — no changes were made"
          else
            echo "FIX COMPLETE"
            echo ""
            echo "Next steps:"
            echo "  1. Re-run the Publish workflow to verify deploy works end-to-end"
            echo "  2. Delete .github/workflows/fix-db-ownership.yml"
          fi
          echo "============================================"
