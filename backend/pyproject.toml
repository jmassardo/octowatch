[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "octowatch"
version = "1.0.0"
description = "GitHub Enterprise Cloud audit log ingestion, detection, and reporting platform"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.137.0",
    "uvicorn[standard]==0.49.0",
    "python-multipart==0.0.32",

    # Data validation
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",

    # Database
    "sqlalchemy==2.0.50",
    "asyncpg==0.31.0",
    "alembic==1.18.4",

    # Task queue
    "celery[valkey]==5.6.3",
    "redis==8.0.0",

    # Auth
    "authlib==1.7.2",
    "python3-saml==1.16.0",
    "PyJWT==2.13.0",

    # Rate limiting
    "slowapi==0.1.10",

    # SQL validation
    "pglast==7.14",

    # GeoIP
    "geoip2==5.2.0",
    "maxminddb==3.1.1",

    # S3 / MinIO ingestion
    "boto3==1.43.29",

    # Azure Blob ingestion
    "azure-storage-blob==12.30.0",

    # Azure Key Vault (secret provider)
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.8.0",

    # HTTP client
    "httpx==0.28.1",

    # Logging
    "structlog==26.1.0",

    # Notifications
    "slack-sdk==3.42.0",
    "aiosmtplib==5.1.1",
    "Jinja2==3.1.6",

    # XLSX export
    "openpyxl==3.1.5",

    # Ticketing
    "atlassian-python-api==4.0.7",
    "PyGithub==2.9.1",

    # IdP enrichment
    "okta==3.4.3",
    "msal==1.37.0",
    "google-auth==2.54.0",
    "google-api-python-client==2.197.0",

    # Git / Rule versioning

    # Data processing (baselines)
    "pandas==3.0.3",
    "numpy==2.4.6",

    # Security
    "cryptography>=42.0.0",
    "defusedxml==0.7.1",

    # YAML for rule import/export
    "PyYAML==6.0.3",

    # Utilities
    "python-dateutil==2.9.0.post0",
    "email-validator==2.3.0",

    # Prometheus metrics
    "prometheus-fastapi-instrumentator==8.0.0",
    "prometheus-client>=0.25.0",

    # Transitive dependency pins (security patches)
    "aiohttp>=3.13.4",
    "Pygments>=2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "mypy==2.0.0",
    "ruff==0.15.12",
    "factory-boy==3.3.3",
    "pytest-mock==3.15.1",
    "respx==0.23.1",
    "types-PyYAML",
    "types-python-dateutil",
    "boto3-stubs[s3]",
    "azure-storage-blob",
    "sqlalchemy[mypy]",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─── ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit (security)
    "T20", # print statements
    "ANN", # annotations
]
ignore = [
    "ANN101",  # missing type for self
    "ANN102",  # missing type for cls
    "ANN401",  # any type annotation
    "S101",    # assert usage (tests)
    "B008",    # function calls in default arguments (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN", "T20"]
# Alembic migrations: SQL DDL constraints and index definitions can exceed 100 chars
# and cannot be meaningfully wrapped without harming SQL readability.
"alembic/**" = ["ANN", "E501"]
# report_service uses SQLAlchemy text() with bound parameters (:param syntax),
# not raw string interpolation of user data. S608 is a false positive here.
"app/services/report_service.py" = ["S608"]
"app/services/compliance_report_service.py" = ["S608"]
"app/services/custom_report_service.py" = ["S608"]
"app/services/health_signal_service.py" = ["S608"]
# threat_intel_service uses SQLAlchemy text() with bound parameters and dynamically
# assembled WHERE clauses from validated internal field names, not user input.
"app/services/threat_intel_service.py" = ["S608"]
# cross_org router uses SQLAlchemy text() with bound parameters (:param syntax) and
# a single dynamically assembled scope clause built from validated internal values.
"app/routers/cross_org.py" = ["S608"]
# supply_chain_service uses SQLAlchemy text() with bound parameters (:param syntax),
# not raw string interpolation of user data. S608 is a false positive here.
"app/services/supply_chain_service.py" = ["S608"]
# package_monitoring_service uses SQLAlchemy text() with bound parameters (:param syntax),
# not raw string interpolation of user data. S608 is a false positive here.
"app/services/package_monitoring_service.py" = ["S608"]
# fix_ann001.py is a one-off development helper script
"fix_ann001.py" = ["T20"]

# ─── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ─── coverage ────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = [
    # App bootstrap / infrastructure wiring – no unit-testable logic
    "app/database.py",
    "app/celery_app.py",
    "app/main.py",
    # Cloud-provider ingestion workers – require real AWS / Azure credentials
    "app/workers/ingestion/s3_worker.py",
    "app/workers/ingestion/azure_worker.py",
]

# ─── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=10"
filterwarnings = [
    "ignore::DeprecationWarning",
]

