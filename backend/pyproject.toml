[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audit-log-analyzer"
version = "1.0.0"
description = "GitHub Enterprise Cloud audit log ingestion, detection, and reporting platform"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.135.2",
    "uvicorn[standard]==0.42.0",
    "python-multipart==0.0.22",

    # Data validation
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",

    # Database
    "sqlalchemy==2.0.48",
    "asyncpg==0.31.0",
    "alembic==1.18.4",

    # Task queue
    "celery[valkey]==5.6.3",
    "redis==7.4.0",

    # Auth
    "authlib==1.6.9",
    "python3-saml==1.16.0",
    "PyJWT==2.12.1",

    # Rate limiting
    "slowapi==0.1.9",

    # SQL validation
    "pglast==7.13",

    # GeoIP
    "geoip2==5.2.0",
    "maxminddb==3.1.1",

    # S3 / MinIO ingestion
    "boto3==1.42.77",

    # Azure Blob ingestion
    "azure-storage-blob==12.28.0",

    # HTTP client
    "httpx==0.27.0",

    # Logging
    "structlog==25.5.0",

    # Notifications
    "slack-sdk==3.41.0",
    "aiosmtplib==5.1.0",
    "Jinja2==3.1.6",

    # Ticketing
    "atlassian-python-api==4.0.7",
    "PyGithub==2.9.0",

    # IdP enrichment
    "okta-sdk-python==2.9.8",
    "msal==1.35.1",
    "google-auth==2.49.1",
    "google-api-python-client==2.193.0",

    # Git / Rule versioning

    # Data processing (baselines)
    "pandas==3.0.1",
    "numpy==2.4.3",

    # Security
    "cryptography>=42.0.0",
    "defusedxml==0.7.1",

    # YAML for rule import/export
    "PyYAML==6.0.3",

    # Utilities
    "python-dateutil==2.9.0.post0",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "mypy==1.10.1",
    "ruff==0.4.10",
    "bandit==1.9.4",
    "pip-audit==2.10.0",
    "factory-boy==3.3.3",
    "pytest-mock==3.14.0",
    "respx==0.22.0",
    "types-PyYAML",
    "types-python-dateutil",
    "boto3-stubs[s3]",
    "azure-storage-blob",
    "sqlalchemy[mypy]",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─── ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit (security)
    "T20", # print statements
    "ANN", # annotations
]
ignore = [
    "ANN101",  # missing type for self
    "ANN102",  # missing type for cls
    "ANN401",  # any type annotation
    "S101",    # assert usage (tests)
    "B008",    # function calls in default arguments (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN", "T20"]
# Alembic migrations: SQL DDL constraints and index definitions can exceed 100 chars
# and cannot be meaningfully wrapped without harming SQL readability.
"alembic/**" = ["ANN", "E501"]
# report_service uses SQLAlchemy text() with bound parameters (:param syntax),
# not raw string interpolation of user data. S608 is a false positive here.
"app/services/report_service.py" = ["S608"]
# fix_ann001.py is a one-off development helper script
"fix_ann001.py" = ["T20"]

# ─── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ─── coverage ────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = [
    # Requires running database connections
    "app/database.py",
    "app/celery_app.py",
    "app/deps.py",
    "app/main.py",
    # Routers require HTTP + DB integration tests
    "app/routers/*",
    # Workers require external queues / cloud storage
    "app/workers/baseline_worker.py",
    "app/workers/detection_worker.py",
    "app/workers/ingestion/minio_worker.py",
    "app/workers/ingestion/s3_worker.py",
    "app/workers/ingestion/azure_worker.py",
    # Ingestion base pipeline requires Valkey + DB (integration test scope)
    "app/workers/ingestion/base.py",
    # Services requiring external APIs or complex DB pipelines
    "app/services/auth_service.py",
    "app/services/idp_service.py",
    "app/services/notification_service.py",
    "app/services/ticketing_service.py",
    "app/services/event_service.py",
    "app/services/rule_service.py",
    # Detection engines and pipeline require DB (integration test scope)
    "app/services/detection_service.py",
    # RBAC async resolver requires DB joins
    "app/services/rbac_service.py",
    # Report aggregation queries require TimescaleDB
    "app/services/report_service.py",
    # Schemas with no standalone testable logic (Pydantic models only)
    "app/schemas/audit_event.py",
    "app/schemas/auth.py",
    "app/schemas/detection.py",
    "app/schemas/integration.py",
    "app/schemas/query.py",
    "app/schemas/report.py",
]

# ─── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
filterwarnings = [
    "ignore::DeprecationWarning",
]
