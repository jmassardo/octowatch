# audit-log-analyzer nginx configuration
# Handles: TLS termination, HTTP→HTTPS redirect, rate limiting, reverse proxy
# Mount TLS certificates into /etc/nginx/ssl/ before starting.
#   - /etc/nginx/ssl/cert.pem   — server certificate (full chain)
#   - /etc/nginx/ssl/key.pem    — private key

# Number of worker processes (auto = one per CPU core)
worker_processes auto;

# Max open file descriptors per worker
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid       /tmp/nginx.pid;  # writable by non-root; matches Docker read-only root FS

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ── Core Settings ─────────────────────────────────────────────────────
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide nginx version from Server header and error pages
    server_tokens off;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout  65;
    client_max_body_size 10m;

    # ── Access Log — JSON (matches structlog output format) ───────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"path":"$uri",'
            '"query":"$query_string",'
            '"status":$status,'
            '"bytes_sent":$bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for",'
            '"request_id":"$request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Gzip Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff2;

    # ── Rate Limiting ─────────────────────────────────────────────────────
    # Auth endpoints: 10 req/min with burst 20 (prevents brute-force login)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # General API: 300 req/min per IP (generous; tighten per org if needed)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=300r/m;


    # Use Docker's embedded DNS resolver so upstream hostnames are re-resolved
    # after container restarts (avoids 502 on stale IP cache).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Proxy Upstream Definitions ────────────────────────────────────────
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    upstream frontend_backend {
        server frontend:3001;
        keepalive 16;
    }


    # ── HTTP → HTTPS Redirect ─────────────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ACME challenge support (Let's Encrypt / cert-manager HTTP-01)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ── HTTPS Main Server ─────────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # ── TLS Configuration ────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Modern TLS — requires TLS 1.2+; disables old cipher suites
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Session resumption
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # ── Security Headers (applied globally to all responses) ──────────
        # Strict Transport Security — 2-year max-age; include subdomains
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Prevent clickjacking
        add_header X-Frame-Options "DENY" always;

        # Prevent MIME-type sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # Control referrer information leakage
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Content Security Policy — restrict script/style origins
        # Adjust 'script-src' to add any CDN domains used by the frontend
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # Permissions policy — disable sensors and payment APIs
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # ── Auth Endpoints — rate limited ──────────────────────────────────
        location /auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        # ── API Proxy — /api/ → api:8000 ─────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            limit_req_status 429;

            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            proxy_connect_timeout 5s;
        }

        # Query endpoint — longer timeout for complex SQL queries
        location /api/query/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;   # Query can take up to QUERY_TIMEOUT_SECONDS
            proxy_send_timeout 30s;
        }

        # Health probes — no rate limiting, no auth (accessed by load balancers)
        location = /health {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_read_timeout 5s;
            access_log off;
        }

        location = /ready {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_read_timeout 10s;
            access_log off;
        }

        # ── Frontend Proxy — / → frontend:3001 ───────────────────────────
        location / {
            proxy_pass         http://frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 10s;

            # Frontend SPA: serve index.html for unknown routes (client-side routing)
            proxy_intercept_errors on;
            error_page 404 /;
        }
    }
}
