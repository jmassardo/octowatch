version: "3.9"

# ---------------------------------------------------------------------------
# Shared environment variables consumed by api, workers, and beat.
# Referenced below via <<: *app-env to avoid repetition.
# See docs/security-and-deployment.md Section 2 for full variable reference.
# ---------------------------------------------------------------------------
x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL}
  VALKEY_URL: ${VALKEY_URL}
  SECRET_KEY: ${SECRET_KEY}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
  GITHUB_RULES_REPO: ${GITHUB_RULES_REPO}
  GITHUB_RULES_TOKEN: ${GITHUB_RULES_TOKEN}
  GITHUB_RULES_BRANCH: ${GITHUB_RULES_BRANCH:-main}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  GEOIP_DB_PATH: ${GEOIP_DB_PATH:-/app/data/GeoLite2-City.mmdb}
  APP_BASE_URL: ${APP_BASE_URL:-https://localhost}
  INITIAL_ADMIN_LOGINS: ${INITIAL_ADMIN_LOGINS:-}

networks:
  # Segmented networks — least-privilege connectivity between services.
  # frontend: nginx ↔ frontend SPA container
  # backend:  nginx ↔ api; workers & beat coordinate via api
  # data:     api/workers/beat ↔ db, valkey, minio
  frontend:
    driver: bridge
  backend:
    driver: bridge
  data:
    driver: bridge

volumes:
  pg_data:
  valkey_data:
  minio_data:

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + TimescaleDB 2.14
  # events table is a TimescaleDB hypertable (weekly chunks).
  # ---------------------------------------------------------------------------
  db:
    image: timescale/timescaledb:2.25.1-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - data
    # No ports exposed to host; application connects via internal network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Valkey 7.2 (BSD-3 Redis-compatible)
  # Used as: Celery broker, JWT session store, dedup bloom filter,
  #          RBAC team cache, MinIO event pub/sub channel minio:events.
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:9.0.3-alpine
    command:
      - valkey-server
      - --requirepass
      - ${VALKEY_PASSWORD}
      - --appendonly
      - "yes"
    volumes:
      - valkey_data:/data
    networks:
      - data
    # No ports exposed to host.
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MinIO RELEASE.2024-06-13T22-53-53Z (AGPL-3.0)
  # Self-hosted S3-compatible object store. GitHub streams audit logs directly
  # here via the nginx /s3/ reverse proxy (TLS-terminated).
  # Bucket event notifications are published to Valkey pub/sub channel
  # `minio:events` on every new .json.gz PUT, triggering near-real-time
  # ingestion without waiting for the Celery Beat polling tick.
  #
  # Ports exposed only on 127.0.0.1 — nginx proxies public S3 traffic from
  # /s3/ → minio:9000. Do not expose MinIO ports directly.
  # See architecture.md §2.1 MinIO mode requirement.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Bucket event notifications → Valkey pub/sub (primary target)
      MINIO_NOTIFY_REDIS_ENABLE_PRIMARY: "on"
      MINIO_NOTIFY_REDIS_ADDRESS_PRIMARY: valkey:6379
      MINIO_NOTIFY_REDIS_PASSWORD_PRIMARY: ${VALKEY_PASSWORD}
      MINIO_NOTIFY_REDIS_KEY_PRIMARY: minio:events
      # access format: publishes the full S3 event notification JSON (Records
      # array) to the Valkey channel via PUBLISH, which the MinioIngestWorker
      # consumes via pub/sub.  (The "namespace" format uses SET, not PUBLISH.)
      MINIO_NOTIFY_REDIS_FORMAT_PRIMARY: access
    volumes:
      - minio_data:/data
    ports:
      # S3 API — bound to localhost only; expose via reverse proxy with TLS
      - "127.0.0.1:9000:9000"
      # MinIO console — bound to localhost only; never expose publicly
      - "127.0.0.1:9001:9001"
    networks:
      - data
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # minio-setup — one-time initialization sidecar (minio/mc)
  # Creates bucket, attaches event notification, creates read-only service
  # account for ingestion workers. Uses `latest` because mc is a CLI tool
  # and version drift does not affect application behaviour.
  # restart: on-failure ensures it retries if MinIO is not yet fully ready.
  # ---------------------------------------------------------------------------
  minio-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_AUDIT_BUCKET: ${MINIO_AUDIT_BUCKET}
      MINIO_INGEST_USER: ${MINIO_INGEST_USER}
      MINIO_INGEST_PASSWORD: ${MINIO_INGEST_PASSWORD}
      MINIO_STREAM_USER: ${MINIO_STREAM_USER:-github-stream}
      MINIO_STREAM_PASSWORD: ${MINIO_STREAM_PASSWORD:-}
    networks:
      - data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # Register local alias
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}

        # Create audit log bucket (idempotent)
        mc mb --ignore-existing local/$${MINIO_AUDIT_BUCKET}

        # Attach bucket event notification: PUT events → Valkey primary target
        mc event add local/$${MINIO_AUDIT_BUCKET} arn:minio:sqs::PRIMARY:redis --event put || true

        # Create read-only ingestion policy (GetObject + ListBucket on audit bucket only)
        cat > /tmp/ro-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject","s3:ListBucket"],
              "Resource": [
                "arn:aws:s3:::$${MINIO_AUDIT_BUCKET}",
                "arn:aws:s3:::$${MINIO_AUDIT_BUCKET}/*"
              ]
            }
          ]
        }
        EOF
        mc admin policy create local ingestion-ro /tmp/ro-policy.json || true

        # Create scoped service account for ingestion workers
        mc admin user add local $${MINIO_INGEST_USER} $${MINIO_INGEST_PASSWORD} || true
        mc admin policy attach local ingestion-ro --user $${MINIO_INGEST_USER} || true

        # Create write policy for GitHub audit log streaming (PutObject + required S3 ops)
        cat > /tmp/stream-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "s3:PutObject",
                "s3:GetBucketLocation",
                "s3:ListBucket",
                "s3:ListBucketMultipartUploads",
                "s3:ListMultipartUploadParts",
                "s3:AbortMultipartUpload"
              ],
              "Resource": [
                "arn:aws:s3:::$${MINIO_AUDIT_BUCKET}",
                "arn:aws:s3:::$${MINIO_AUDIT_BUCKET}/*"
              ]
            }
          ]
        }
        EOF
        mc admin policy create local streaming-write /tmp/stream-policy.json || true

        # Create GitHub streaming service account (only if password is configured)
        if [ -n "$${MINIO_STREAM_PASSWORD}" ]; then
          mc admin user add local $${MINIO_STREAM_USER} $${MINIO_STREAM_PASSWORD} || true
          mc admin policy attach local streaming-write --user $${MINIO_STREAM_USER} || true
          echo "minio-setup: streaming user '$${MINIO_STREAM_USER}' provisioned"
        else
          echo "minio-setup: MINIO_STREAM_PASSWORD not set, skipping streaming user creation"
          echo "minio-setup: configure via OctoWatch admin UI → Audit Log Streaming"
        fi

        echo "minio-setup: completed successfully"
    restart: on-failure

  # ---------------------------------------------------------------------------
  # migrate — runs Alembic schema migrations before the API starts.
  # Uses condition: service_completed_successfully so the api service waits
  # until this exits 0. On failure (exit non-zero), Compose logs the error
  # and the api service does not start.
  # restart: on-failure retries up to 3 times if db is temporarily unavailable.
  # ---------------------------------------------------------------------------
  migrate:
    image: octowatch-api:latest
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - data
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # ---------------------------------------------------------------------------
  # api — FastAPI 0.111 application server (uvicorn)
  # All secrets injected via environment. No hardcoded credentials.
  # For horizontal scaling, run: docker compose up --scale api=3
  # Update nginx upstream block to list all api instances if scaling manually.
  # ---------------------------------------------------------------------------
  api:
    image: octowatch-api:latest
    environment:
      <<: *app-env
      # Ingestion mode determines which storage backend to use
      INGESTION_MODE: ${INGESTION_MODE:-minio}
      # MinIO connection (used by api for presigned URL generation and status)
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_INGEST_USER: ${MINIO_INGEST_USER}
      MINIO_INGEST_PASSWORD: ${MINIO_INGEST_PASSWORD}
      MINIO_AUDIT_BUCKET: ${MINIO_AUDIT_BUCKET}
      # SAML — optional; leave blank to disable SAML auth
      SAML_SP_CERT: ${SAML_SP_CERT:-}
      SAML_SP_KEY: ${SAML_SP_KEY:-}
      SAML_IDP_METADATA_URL: ${SAML_IDP_METADATA_URL:-}
      # MaxMind GeoIP license (used at startup to fetch mmdb if not present)
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      # Query engine limits
      DETECTION_CONFIDENCE_THRESHOLD: ${DETECTION_CONFIDENCE_THRESHOLD:-0.7}
      QUERY_MAX_ROWS: ${QUERY_MAX_ROWS:-100000}
      QUERY_TIMEOUT_SECONDS: ${QUERY_TIMEOUT_SECONDS:-30}
      # GitHub App — Enterprise Sync config (optional)
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:+/app/secrets/github-app-key.pem}
      GITHUB_ENTERPRISE_SLUG: ${GITHUB_ENTERPRISE_SLUG:-}
      GITHUB_SYNC_ENABLED: ${GITHUB_SYNC_ENABLED:-false}
      GITHUB_SYNC_INTERVAL_DAYS: ${GITHUB_SYNC_INTERVAL_DAYS:-60}
      GITHUB_SYNC_ORGS: ${GITHUB_SYNC_ORGS:-}
    volumes:
      - ${GITHUB_APP_PRIVATE_KEY_PATH:-/dev/null}:/app/secrets/github-app-key.pem:ro
    networks:
      - backend
      - data
    # No ports exposed to host; nginx proxies /api/ → api:8000
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # worker-ingestion — Celery worker for ingestion queue
  # Concurrency: 4 (one thread per concurrent source; bounded to avoid OOM
  # from parallel gzip decompression of large audit log files).
  # ---------------------------------------------------------------------------
  worker-ingestion:
    image: octowatch-worker:latest
    command: ["celery", "-A", "app.celery_app", "worker", "-Q", "ingestion", "-c", "4", "--loglevel", "${LOG_LEVEL:-INFO}"]
    environment:
      <<: *app-env
      INGESTION_MODE: ${INGESTION_MODE:-minio}
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      # Ingestion worker uses the scoped service account, not root credentials
      MINIO_INGEST_USER: ${MINIO_INGEST_USER}
      MINIO_INGEST_PASSWORD: ${MINIO_INGEST_PASSWORD}
      MINIO_AUDIT_BUCKET: ${MINIO_AUDIT_BUCKET}
      # AWS S3 credentials — only required when INGESTION_MODE=s3
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      S3_AUDIT_BUCKET: ${S3_AUDIT_BUCKET:-}
      # Azure Blob credentials — only required when INGESTION_MODE=azure_blob
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_AUDIT_CONTAINER: ${AZURE_AUDIT_CONTAINER:-}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
    networks:
      - backend
      - data
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # worker-detection — Celery worker for detection queue
  # Concurrency: 8 (detection rule evaluation is CPU-bound; 8 processes
  # saturates a 4-core host while leaving headroom for other services).
  # Includes all IdP enrichment, notification, and ticketing credentials.
  # ---------------------------------------------------------------------------
  worker-detection:
    image: octowatch-worker:latest
    command: ["celery", "-A", "app.celery_app", "worker", "-Q", "detection", "-c", "8", "--loglevel", "${LOG_LEVEL:-INFO}"]
    environment:
      <<: *app-env
      DETECTION_CONFIDENCE_THRESHOLD: ${DETECTION_CONFIDENCE_THRESHOLD:-0.7}
      # IdP enrichment — Okta
      OKTA_ORG_URL: ${OKTA_ORG_URL:-}
      OKTA_API_TOKEN: ${OKTA_API_TOKEN:-}
      # IdP enrichment — Azure AD / Entra
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET:-}
      # IdP enrichment — Google Workspace
      GOOGLE_WORKSPACE_DOMAIN: ${GOOGLE_WORKSPACE_DOMAIN:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      # Notifications
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      # Ticketing
      JIRA_URL: ${JIRA_URL:-}
      JIRA_USERNAME: ${JIRA_USERNAME:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
    networks:
      - backend
      - data
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # worker-baseline — Celery worker for behavioral baseline queue
  # Concurrency: 2 (baseline recomputation is I/O-bound and runs hourly;
  # low concurrency prevents it from competing with detection workers).
  # ---------------------------------------------------------------------------
  worker-baseline:
    image: octowatch-worker:latest
    command: ["celery", "-A", "app.celery_app", "worker", "-Q", "baseline", "-c", "2", "--loglevel", "${LOG_LEVEL:-INFO}"]
    environment:
      <<: *app-env
    networks:
      - backend
      - data
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # worker-sync — Celery worker for GitHub Enterprise Sync queue
  # Concurrency: 4 (GitHub API rate limits constrain throughput more than
  # local resources; 4 workers allow parallel sync of independent orgs).
  # ---------------------------------------------------------------------------
  worker-sync:
    image: octowatch-worker:latest
    command: ["celery", "-A", "app.celery_app", "worker", "-Q", "github_sync", "--pool=solo", "--loglevel", "${LOG_LEVEL:-INFO}"]
    environment:
      <<: *app-env
      INGESTION_MODE: ${INGESTION_MODE:-minio}
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_INGEST_USER: ${MINIO_INGEST_USER}
      MINIO_INGEST_PASSWORD: ${MINIO_INGEST_PASSWORD}
      MINIO_AUDIT_BUCKET: ${MINIO_AUDIT_BUCKET}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:+/app/secrets/github-app-key.pem}
      GITHUB_ENTERPRISE_SLUG: ${GITHUB_ENTERPRISE_SLUG:-}
      GITHUB_SYNC_ENABLED: ${GITHUB_SYNC_ENABLED:-false}
      GITHUB_SYNC_INTERVAL_DAYS: ${GITHUB_SYNC_INTERVAL_DAYS:-60}
      GITHUB_SYNC_ORGS: ${GITHUB_SYNC_ORGS:-}
    volumes:
      - ${GITHUB_APP_PRIVATE_KEY_PATH:-/dev/null}:/app/secrets/github-app-key.pem:ro
    networks:
      - backend
      - data
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # beat — Celery Beat scheduler
  # CRITICAL: Only ONE beat instance must ever run. Running multiple causes
  # duplicate task scheduling (double ingestion, double baseline recomputation).
  # PersistentScheduler stores the schedule state in /tmp/celerybeat-schedule.
  # ---------------------------------------------------------------------------
  beat:
    image: octowatch-worker:latest
    command: ["celery", "-A", "app.celery_app", "beat", "--scheduler", "celery.beat:PersistentScheduler", "--loglevel", "${LOG_LEVEL:-INFO}"]
    environment:
      <<: *app-env
    networks:
      - backend
      - data
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # frontend — React 18 + Vite production build served by a static HTTP server
  # Not exposed directly; nginx proxies / → frontend:3001
  # ---------------------------------------------------------------------------
  frontend:
    image: octowatch-frontend:latest
    networks:
      - frontend
    depends_on:
      - api
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # nginx 1.26 — TLS termination and reverse proxy
  # Proxies: /api/  → api:8000
  #          /s3/   → minio:9000 (GitHub audit log streaming)
  #          /      → frontend:3001
  # HTTP → HTTPS redirect enforced. HSTS header applied.
  # Mount your TLS certificates into ./nginx/ssl/ before starting.
  # See nginx/nginx.conf for full header and proxy configuration.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.28-alpine
    ports:
      # Both ports exposed to host — nginx is the only external entry point
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend
      - backend
      - data
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
